name: Repair VISIT AHAKI LP Mobile Header V1.3

on:
  push:
    paths:
      - ".github/workflows/repair-visit-ahaki-lp-visual.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Freeze current repaired LP and non-LP scope
        shell: bash
        run: |
          set -eux
          test "$(sha256sum lp.html | awk '{print $1}')" = "7eab16f3edf2519e958acaf61e2edc4705cad8e489a6b612ba00fe14a4f1d778"
          test "$(sha256sum flyer-visit-ahaki.html | awk '{print $1}')" = "4b3375973ddc87b07610d98478bb202ccb0c09bc2352b5f836bc92f9377c1865"
          test "$(sha256sum DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf | awk '{print $1}')" = "e15295bf9b7709463f34f18eb79892fa24c019c3ed7e7e1dee7687462d4b0091"
          sha256sum \
            flyer-visit-ahaki.html \
            DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf \
            app.js config.js owner.html staff.html customer.html guide.html demo.html system-check.html \
            > /tmp/frozen-before.sha256

      - name: Apply mobile-header-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("lp.html")
          s=p.read_text(encoding="utf-8")
          old='      .hero-copy,.consult-copy{padding-left:18px;padding-right:18px}\n      h1{font-size:32px}'
          new='      .hero-copy,.consult-copy{padding-left:18px;padding-right:18px}\n      .topbar .wrap{gap:6px}\n      .brand{font-size:12px;letter-spacing:0;white-space:nowrap;flex-shrink:0}\n      .nav{gap:0;flex-wrap:nowrap;flex-shrink:0}\n      .nav .cta{font-size:11px;padding:0 9px;white-space:nowrap;flex-shrink:0}\n      h1{font-size:32px}'
          if s.count(old)!=1:
              raise SystemExit(f"mobile anchor match count={s.count(old)}")
          s=s.replace(old,new)
          p.write_text(s,encoding="utf-8")
          print("LP_MOBILE_HEADER_PATCH=APPLIED")
          PY

      - name: Install Playwright
        shell: bash
        run: |
          set -eux
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p presentation-qa/lp-visual-v1.3

      - name: Render full visual contract
        shell: bash
        run: |
          cat > qa-lp-v13.js <<'JS'
          const { chromium } = require("playwright");
          const fs=require("fs");
          const path=require("path");
          const widths=[375,390,430,768,1280,1440];

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const file="file://"+path.resolve("lp.html");
            const results=[];

            for(const width of widths){
              const page=await browser.newPage({viewport:{width,height:1000}});
              const errors=[];
              page.on("pageerror",e=>errors.push("pageerror: "+e.message));
              page.on("console",m=>{if(m.type()==="error")errors.push("console: "+m.text())});
              await page.goto(file,{waitUntil:"load"});
              await page.waitForTimeout(400);

              const q=await page.evaluate(()=>{
                function measure(el){
                  const r=document.createRange();
                  r.selectNodeContents(el);
                  const rects=[...r.getClientRects()].map(x=>({x:x.x,y:x.y,width:x.width,height:x.height}));
                  const b=el.getBoundingClientRect();
                  return {text:el.textContent,rects,box:{x:b.x,y:b.y,width:b.width,height:b.height}};
                }
                const de=document.documentElement;
                const hero=[...document.querySelectorAll("#p1 .hero-line")].map(measure);
                const brand=measure(document.querySelector(".brand"));
                const topcta=measure(document.querySelector(".nav .cta"));
                const big=document.querySelector("#p8 .big");
                const priceMain=measure(document.querySelector("#p8 .price-main"));
                const priceTax=measure(document.querySelector("#p8 .price-tax"));
                const buttons=[...document.querySelectorAll("a.btn,.nav .cta")];
                return {
                  sections:[...document.querySelectorAll("main>section")].map(x=>x.id),
                  scrollWidth:de.scrollWidth,clientWidth:de.clientWidth,
                  hero,brand,topcta,priceMain,priceTax,
                  priceBox:{scrollWidth:big.scrollWidth,clientWidth:big.clientWidth},
                  minControlHeight:Math.min(...buttons.map(x=>x.getBoundingClientRect().height))
                };
              });

              const expected=["p1","p2","p3","p4","p5","p6","p7","p8","p9","p10"];
              if(JSON.stringify(q.sections)!==JSON.stringify(expected)) throw new Error("section order "+width);
              if(q.scrollWidth>q.clientWidth+1) throw new Error("horizontal overflow "+width);
              if(q.hero.length!==3 || q.hero.some(x=>x.rects.length!==1)) throw new Error("hero wrap "+width);
              if(q.priceMain.rects.length!==1 || q.priceTax.rects.length!==1) throw new Error("price wrap "+width);
              if(q.priceBox.scrollWidth>q.priceBox.clientWidth+1) throw new Error("price overflow "+width);
              if(width<=430 && q.brand.rects.length!==1) throw new Error("brand wrap "+width);
              if(width<=430 && q.topcta.rects.length!==1) throw new Error("top CTA wrap "+width);
              if(q.minControlHeight<44) throw new Error("control <44 "+width);
              if(errors.length) throw new Error("console "+width+": "+errors.join(" | "));

              await page.screenshot({path:`presentation-qa/lp-visual-v1.3/lp-${width}.png`,fullPage:true});
              results.push({width,...q,errors,result:"PASS"});
              await page.close();
            }

            fs.writeFileSync(
              "presentation-qa/LP_VISUAL_REPAIR_QA_V1.3.json",
              JSON.stringify({
                master:"DPRO-LP-MASTER-V1.4",
                repair:"mobile topbar no-wrap + V1.2 hero/price preservation",
                checks:"P1-P10 / overflow0 / hero3lines / price no-wrap / mobile brand no-wrap / mobile top CTA no-wrap / controls>=44 / console0",
                widths,results,result:"GREEN"
              },null,2)
            );
            await browser.close();
            console.log("LP_VISUAL_REPAIR_V1.3_QA=GREEN");
          })();
          JS
          node qa-lp-v13.js
          rm -f qa-lp-v13.js

      - name: Verify frozen scope byte-identical
        shell: bash
        run: |
          set -eux
          sha256sum \
            flyer-visit-ahaki.html \
            DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf \
            app.js config.js owner.html staff.html customer.html guide.html demo.html system-check.html \
            | diff - /tmp/frozen-before.sha256
          echo FROZEN_SCOPE_BYTE_IDENTITY=PASS

      - name: Commit mobile header repair only
        shell: bash
        run: |
          set -eux
          rm -rf node_modules package.json package-lock.json
          git rm .github/workflows/repair-visit-ahaki-lp-visual.yml
          git config user.name "DPRO SYSTEM FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add lp.html presentation-qa/LP_VISUAL_REPAIR_QA_V1.3.json presentation-qa/lp-visual-v1.3
          git diff --cached --name-only | tee /tmp/staged.txt
          python - <<'PY'
          from pathlib import Path
          paths=set(Path("/tmp/staged.txt").read_text().splitlines())
          allowed={".github/workflows/repair-visit-ahaki-lp-visual.yml","lp.html","presentation-qa/LP_VISUAL_REPAIR_QA_V1.3.json"}
          for p in paths:
              if p.startswith("presentation-qa/lp-visual-v1.3/"): continue
              if p not in allowed: raise SystemExit(f"Unexpected staged path: {p}")
          PY
          git commit -m "Fix VISIT AHAKI LP mobile header"
          git push
