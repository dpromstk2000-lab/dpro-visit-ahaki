name: Capture VISIT AHAKI Current LIVE Evidence V1.0

on:
  push:
    paths:
      - ".github/workflows/capture-visit-ahaki-live-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture current public LIVE screens
        shell: bash
        run: |
          mkdir -p live-evidence
          cat > /tmp/capture.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const crypto = require('crypto');

          const BASE='https://dpromstk2000-lab.github.io/dpro-visit-ahaki/';
          const out='live-evidence';
          const manifest={capturedAt:new Date().toISOString(),source:'CURRENT_PUBLIC_LIVE',items:[],errors:[]};

          async function capture(browser, spec){
            const context=await browser.newContext({viewport:spec.viewport, deviceScaleFactor:1});
            const page=await context.newPage();
            const errs=[];
            page.on('pageerror',e=>errs.push('pageerror: '+e.message));
            page.on('console',m=>{ if(m.type()==='error') errs.push('console: '+m.text()); });
            const url=BASE+spec.path;
            await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            if(spec.click){
              await page.locator(spec.click).click({timeout:20000});
              if(spec.wait) await page.locator(spec.wait).waitFor({state:'visible',timeout:30000});
              await page.waitForTimeout(1200);
            }
            if(spec.assertText){
              const text=await page.locator('body').innerText();
              if(!text.includes(spec.assertText)) throw new Error(spec.name+': expected text not found: '+spec.assertText);
            }
            const metrics=await page.evaluate(()=>({
              scrollWidth:document.documentElement.scrollWidth,
              clientWidth:document.documentElement.clientWidth,
              scrollHeight:document.documentElement.scrollHeight,
              title:document.title
            }));
            if(metrics.scrollWidth>metrics.clientWidth+1) errs.push(`horizontal-overflow:${metrics.scrollWidth}-${metrics.clientWidth}`);
            const file=`${out}/${spec.name}.png`;
            await page.screenshot({path:file,fullPage:true});
            const data=fs.readFileSync(file);
            manifest.items.push({
              name:spec.name,url,viewport:spec.viewport,metrics,
              sha256:crypto.createHash('sha256').update(data).digest('hex'),
              safeAction:spec.safeAction||'none',
              businessMutation:'0 by capture workflow',
              errors:errs
            });
            if(errs.length) manifest.errors.push({name:spec.name,errors:errs});
            await context.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const specs=[
              {name:'demo-desktop',path:'demo.html',viewport:{width:1440,height:1000},assertText:'SYNTHETIC DEMO'},
              {name:'owner-desktop',path:'owner.html',viewport:{width:1440,height:1100},click:'#loginOwner',wait:'#visits .card',assertText:'Visit Day Control Tower',safeAction:'Owner Demo session login only'},
              {name:'staff-mobile',path:'staff.html',viewport:{width:390,height:844},click:'#login',wait:'#visits .card',assertText:'本日の担当訪問',safeAction:'Staff Demo session login only'},
              {name:'patient-mobile',path:'customer.html',viewport:{width:390,height:844},click:'#patient',wait:'#visits .card',assertText:'訪問予定',safeAction:'Patient Demo session login only'},
              {name:'family-mobile',path:'customer.html',viewport:{width:390,height:844},click:'#family',wait:'#visits .card',assertText:'家族代理scope',safeAction:'Family Demo session login only'},
              {name:'system-check-desktop',path:'system-check.html',viewport:{width:1440,height:1100},wait:'#checks .card',assertText:'System Check',safeAction:'GET System Check only'}
            ];
            for(const spec of specs){
              try{
                if(spec.wait && !spec.click){
                  const context=await browser.newContext({viewport:spec.viewport});
                  const page=await context.newPage();
                  const errs=[];
                  page.on('pageerror',e=>errs.push('pageerror: '+e.message));
                  page.on('console',m=>{if(m.type()==='error')errs.push('console: '+m.text())});
                  const url=BASE+spec.path;
                  await page.goto(url,{waitUntil:'networkidle',timeout:60000});
                  await page.locator(spec.wait).waitFor({state:'visible',timeout:30000});
                  await page.waitForTimeout(1000);
                  const text=await page.locator('body').innerText();
                  if(!text.includes(spec.assertText)) throw new Error(spec.name+': expected text missing');
                  const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,scrollHeight:document.documentElement.scrollHeight,title:document.title}));
                  if(metrics.scrollWidth>metrics.clientWidth+1) errs.push(`horizontal-overflow:${metrics.scrollWidth}-${metrics.clientWidth}`);
                  const file=`${out}/${spec.name}.png`;
                  await page.screenshot({path:file,fullPage:true});
                  const data=fs.readFileSync(file);
                  manifest.items.push({name:spec.name,url,viewport:spec.viewport,metrics,sha256:crypto.createHash('sha256').update(data).digest('hex'),safeAction:spec.safeAction,businessMutation:'0 by capture workflow',errors:errs});
                  if(errs.length)manifest.errors.push({name:spec.name,errors:errs});
                  await context.close();
                } else {
                  await capture(browser,spec);
                }
              }catch(e){
                manifest.errors.push({name:spec.name,errors:[String(e.stack||e)]});
              }
            }
            await browser.close();
            fs.writeFileSync(`${out}/live-evidence-manifest.json`,JSON.stringify(manifest,null,2));
            if(manifest.items.length!==6 || manifest.errors.length){
              console.error(JSON.stringify(manifest,null,2));
              process.exit(2);
            }
          })();
          JS
          node /tmp/capture.js
          sha256sum live-evidence/*.png live-evidence/live-evidence-manifest.json > live-evidence/SHA256SUMS.txt
          cat live-evidence/live-evidence-manifest.json

      - name: Upload LIVE evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_VISIT_AHAKI_CURRENT_LIVE_EVIDENCE_V1.0
          path: live-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/capture-visit-ahaki-live-evidence.yml
          git config user.name "DPRO SYSTEM FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove VISIT AHAKI LIVE evidence capture workflow"
          git push
