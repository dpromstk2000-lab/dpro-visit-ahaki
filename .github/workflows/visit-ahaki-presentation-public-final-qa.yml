name: VISIT AHAKI Presentation Public Final QA V1.0

on:
  push:
    paths:
      - ".github/workflows/visit-ahaki-presentation-public-final-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock presentation baseline and frozen SYSTEM scope
        shell: bash
        run: |
          set -eux
          git merge-base --is-ancestor c345226da06f708669cefc51773038c918ff05eb HEAD

          test "$(sha256sum DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf | awk '{print $1}')" = "303baa04b83290705533877b3b951cd9ede70e874bac67b56b3669959121c0be"
          test "$(sha256sum DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf | awk '{print $1}')" = "55f0abdd636474846b2b250d5dd9a9cedcfdd3f9534403ea1917131c94b62848"

          sha256sum \
            app.js config.js owner.html staff.html customer.html demo.html system-check.html styles.css \
            lp.html flyer-visit-ahaki.html DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf \
            guide.html tutorial.html \
            DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf \
            DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf \
            > /tmp/frozen-before.sha256

      - name: Install public QA dependencies
        shell: bash
        run: |
          set -eux
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p presentation-qa/public-final-v1.0/downloads
          mkdir -p presentation-qa/public-final-v1.0/screens

      - name: Verify public Pages files are byte-identical
        shell: bash
        run: |
          set -eux
          BASE="https://dpromstk2000-lab.github.io/dpro-visit-ahaki"
          OUT="presentation-qa/public-final-v1.0/downloads"

          files=(
            "lp.html"
            "guide.html"
            "tutorial.html"
            "DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf"
            "DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf"
            "DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf"
          )

          for f in "${files[@]}"; do
            ok=0
            for i in $(seq 1 12); do
              curl -fsSL --retry 2 --retry-delay 2 \
                -H 'Cache-Control: no-cache' \
                "${BASE}/${f}?public-final-qa=${GITHUB_RUN_ID}-${i}" \
                -o "${OUT}/${f}" || true
              if [ -f "${OUT}/${f}" ] && cmp -s "$f" "${OUT}/${f}"; then
                echo "PUBLIC_BYTE_IDENTITY=PASS ${f}"
                ok=1
                break
              fi
              echo "Waiting for Pages sync: ${f} attempt=${i}"
              sleep 5
            done
            test "$ok" = "1"
          done

      - name: Verify public PDF page counts and visible copy
        shell: bash
        run: |
          set -eux
          OUT="presentation-qa/public-final-v1.0/downloads"
          test "$(pdfinfo "${OUT}/DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf" | awk '/^Pages:/ {print $2}')" = "1"
          test "$(pdfinfo "${OUT}/DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf" | awk '/^Pages:/ {print $2}')" = "3"
          test "$(pdfinfo "${OUT}/DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf" | awk '/^Pages:/ {print $2}')" = "10"

          pdftotext -layout "${OUT}/DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf" /tmp/quick.txt
          pdftotext -layout "${OUT}/DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf" /tmp/detailed.txt

          python - <<'PY'
          from pathlib import Path
          banned = [
              'exactly 10','Tutorial state','System identity','Runtime',
              'Auth boundary','Production Guard','tenant','Owner Auth','顧客Auth',
              'scope','Binding','versioned','READY工程','契約後READY',
              'Post-contract settings','field role','safe notification boundary',
              'Claim Readiness','Impact Preflight',
              'Current public LIVE screen evidence only','MASTER V1.1','A4 portrait'
          ]
          for p in ['/tmp/quick.txt','/tmp/detailed.txt']:
              text=Path(p).read_text(encoding='utf-8',errors='ignore')
              hits=[x for x in banned if x in text]
              if hits:
                  raise SystemExit(f'{p}: public internal terms remain: {hits}')
          print('PUBLIC_PDF_VISIBLE_COPY=PASS')
          PY

      - name: Public browser responsive and First10 QA
        shell: bash
        run: |
          cat > qa-public-final.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const BASE='https://dpromstk2000-lab.github.io/dpro-visit-ahaki/';
          const report={pages:[],first10:{},guideLinks:{},result:'PENDING'};

          function guard(page){
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
            return errors;
          }

          async function responsive(browser,path,width){
            const context=await browser.newContext({viewport:{width,height:900}});
            const page=await context.newPage();
            const errors=guard(page);
            await page.goto(BASE+path,{waitUntil:'networkidle',timeout:60000});
            const metrics=await page.evaluate(()=>({
              scrollWidth:document.documentElement.scrollWidth,
              clientWidth:document.documentElement.clientWidth,
              title:document.title
            }));
            if(metrics.scrollWidth>metrics.clientWidth+1) throw new Error(`${path} overflow ${width}`);
            if(errors.length) throw new Error(`${path} console ${width}: ${errors.join(' | ')}`);
            await page.screenshot({
              path:`presentation-qa/public-final-v1.0/screens/${path.split('?')[0].replace('.html','')}-${width}.png`,
              fullPage:true
            });
            report.pages.push({path,width,...metrics,consoleErrors:0,result:'PASS'});
            await context.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});

            for(const width of [390,1440]){
              await responsive(browser,'lp.html',width);
              await responsive(browser,'guide.html',width);
              await responsive(browser,'tutorial.html?mode=start',width);
            }

            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true});
            const page=await context.newPage();
            const errors=guard(page);

            await page.goto(BASE+'guide.html',{waitUntil:'networkidle'});
            const hrefs=await page.evaluate(()=>({
              quick:document.querySelector('a[href*="QUICK_START_MASTER"]')?.getAttribute('href')||null,
              detailed:document.querySelector('a[href*="DETAILED_MANUAL_MASTER"]')?.getAttribute('href')||null,
              start:document.querySelector('#startFirst10')?.getAttribute('href')||null,
              resume:document.querySelector('#resumeFirst10')?.getAttribute('href')||null,
              replay:document.querySelector('#replayFirst10')?.getAttribute('href')||null
            }));

            const expected={
              quick:'DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf',
              detailed:'DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf',
              start:'tutorial.html?mode=start',
              resume:'tutorial.html?mode=resume',
              replay:'tutorial.html?mode=replay'
            };
            for(const [k,v] of Object.entries(expected)){
              if(hrefs[k]!==v) throw new Error(`Guide href ${k}: ${hrefs[k]} != ${v}`);
            }
            report.guideLinks={...hrefs,result:'PASS'};

            await page.locator('#startFirst10').tap();
            await page.waitForURL('**/tutorial.html?mode=start');
            let text=await page.locator('#progressText').innerText();
            if(text!=='Step 1 / 10') throw new Error('Start did not begin at Step 1');

            await page.locator('#next').tap();
            text=await page.locator('#progressText').innerText();
            if(text!=='Step 2 / 10') throw new Error('Next did not advance to Step 2');

            await page.locator('#close').tap();
            await page.waitForURL('**/guide.html');

            await page.locator('#resumeFirst10').tap();
            await page.waitForURL('**/tutorial.html?mode=resume');
            text=await page.locator('#progressText').innerText();
            if(text!=='Step 2 / 10') throw new Error('Resume did not return to Step 2');

            await page.keyboard.press('Escape');
            await page.waitForURL('**/guide.html');

            await page.locator('#replayFirst10').tap();
            await page.waitForURL('**/tutorial.html?mode=replay');
            text=await page.locator('#progressText').innerText();
            if(text!=='Step 1 / 10') throw new Error('Replay did not reset to Step 1');

            if(errors.length) throw new Error('First10 public console: '+errors.join(' | '));
            report.first10={
              Start:'PASS',Next:'PASS',Close:'PASS',Resume:'PASS',Esc:'PASS',Replay:'PASS',
              publicConsoleErrors:0,result:'PASS'
            };

            await context.close();
            await browser.close();

            report.result='GREEN';
            fs.writeFileSync(
              'presentation-qa/public-final-v1.0/PUBLIC_PRESENTATION_FINAL_QA_V1.0.json',
              JSON.stringify(report,null,2)
            );
            console.log('PUBLIC_PRESENTATION_FINAL_QA=GREEN');
          })();
          JS
          node qa-public-final.js
          rm -f qa-public-final.js

      - name: Verify frozen scope byte-identical
        shell: bash
        run: |
          set -eux
          sha256sum \
            app.js config.js owner.html staff.html customer.html demo.html system-check.html styles.css \
            lp.html flyer-visit-ahaki.html DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf \
            guide.html tutorial.html \
            DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf \
            DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf \
            | diff - /tmp/frozen-before.sha256
          echo PUBLIC_FINAL_FROZEN_SCOPE=PASS

      - name: Write final presentation gate evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          summary={
            'system':'DPRO VISIT AHAKI',
            'master':'CENTRAL PRESENTATION / TUTORIAL MASTER V1.2',
            'public_final_qa':'GREEN',
            'A4':'GREEN',
            'LP':'GREEN',
            'Tutorial':'GREEN',
            'Guide_Center':'GREEN',
            'Quick_Start':{
              'pages':3,
              'public_byte_identity':'PASS',
              'public_copy':'PASS',
              'final_render_qr_from_v13':'5/5 PASS'
            },
            'Detailed_Manual':{
              'pages':10,
              'public_byte_identity':'PASS',
              'public_copy':'PASS',
              'final_render_qr_from_v13':'10/10 PASS'
            },
            'frozen_scope':'PASS',
            'presentation_tutorial_gate_v1_2':'PASS',
            'complete_final_lock':'READY_TO_RESTORE',
            'source_commit_before_public_qa':'c345226da06f708669cefc51773038c918ff05eb',
            'sha256':{
              'quick':hashlib.sha256(Path('DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf').read_bytes()).hexdigest(),
              'detailed':hashlib.sha256(Path('DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf').read_bytes()).hexdigest(),
              'a4':hashlib.sha256(Path('DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf').read_bytes()).hexdigest()
            }
          }
          Path('presentation-qa/public-final-v1.0/PRESENTATION_TUTORIAL_GATE_V1.2_FINAL.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Commit QA evidence and remove temporary workflow
        shell: bash
        run: |
          set -eux
          rm -rf node_modules package.json package-lock.json
          rm -rf presentation-qa/public-final-v1.0/downloads
          git rm .github/workflows/visit-ahaki-presentation-public-final-qa.yml
          git config user.name "DPRO SYSTEM FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add presentation-qa/public-final-v1.0
          git diff --cached --name-only | tee /tmp/staged.txt

          python - <<'PY'
          from pathlib import Path
          paths=set(Path('/tmp/staged.txt').read_text().splitlines())
          for p in paths:
              if p == '.github/workflows/visit-ahaki-presentation-public-final-qa.yml':
                  continue
              if p.startswith('presentation-qa/public-final-v1.0/'):
                  continue
              raise SystemExit(f'Unexpected staged path: {p}')
          PY

          git commit -m "Verify VISIT AHAKI presentation public final QA"
          git push
