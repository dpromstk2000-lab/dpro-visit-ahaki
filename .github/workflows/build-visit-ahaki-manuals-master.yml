name: Build VISIT AHAKI Quick Detailed Master V1.1

on:
  push:
    paths:
      - ".github/workflows/build-visit-ahaki-manuals-master.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock approved baseline and frozen scope
        shell: bash
        run: |
          set -eux
          git merge-base --is-ancestor bd114978959b1d800e536a60c1abfb0f068bf07d HEAD

          test "$(sha256sum lp.html | awk '{print $1}')" = "60d6a1777a4ad87855628bcd07a7847583dcf5a810ab86be4e8269906ee6c5e7"
          test "$(sha256sum flyer-visit-ahaki.html | awk '{print $1}')" = "4b3375973ddc87b07610d98478bb202ccb0c09bc2352b5f836bc92f9377c1865"
          test "$(sha256sum DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf | awk '{print $1}')" = "e15295bf9b7709463f34f18eb79892fa24c019c3ed7e7e1dee7687462d4b0091"
          test "$(sha256sum guide.html | awk '{print $1}')" = "8be516c6d5aaa9043bdf876a4dcb7859e743b147a707f0ae3490d9907b9e5d43"
          test "$(sha256sum tutorial.html | awk '{print $1}')" = "f0626f0ba5fbe79e9519523b2255402c3771dd9e73133c19fd675aa5d911f7f6"
          test "$(sha256sum DPRO_VISIT_AHAKI_QUICK_START_V1.0_20260902.pdf | awk '{print $1}')" = "5c56f8c589891b1cab80fa9734f29a502b244176dda5c55f6b7bcc84d93363ac"
          test "$(sha256sum DPRO_VISIT_AHAKI_DETAILED_MANUAL_V1.0_20260902.pdf | awk '{print $1}')" = "716b50e76cf4470c4892a7310ffc5509370a8d5ea7c9ec19e0f278eeb1250399"

          sha256sum \
            lp.html flyer-visit-ahaki.html DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf \
            tutorial.html app.js config.js owner.html staff.html customer.html demo.html system-check.html styles.css \
            > /tmp/frozen-before.sha256

      - name: Install PDF browser and QA dependencies
        shell: bash
        run: |
          set -eux
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          python -m pip install --quiet qrcode pillow opencv-python-headless pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p manuals/assets presentation-qa/manuals-v1.1

      - name: Verify current public Guide Tutorial and URLs
        shell: bash
        run: |
          set -eux
          for u in \
            "https://dpromstk2000-lab.github.io/dpro-visit-ahaki/" \
            "https://dpromstk2000-lab.github.io/dpro-visit-ahaki/demo.html" \
            "https://dpromstk2000-lab.github.io/dpro-visit-ahaki/guide.html" \
            "https://dpromstk2000-lab.github.io/dpro-visit-ahaki/tutorial.html?mode=start" \
            "https://dpromstk2000-lab.github.io/dpro-visit-ahaki/owner.html" \
            "https://dpromstk2000-lab.github.io/dpro-visit-ahaki/staff.html" \
            "https://dpromstk2000-lab.github.io/dpro-visit-ahaki/customer.html" \
            "https://dpromstk2000-lab.github.io/dpro-visit-ahaki/system-check.html"
          do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' "$u")"
            test "$code" = "200"
            echo "HTTP_200 $u"
          done

          cat > capture-manual-web.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const specs=[
              {
                name:'guide-live-390',
                url:'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/guide.html',
                viewport:{width:390,height:844},
                expect:'First10を開始'
              },
              {
                name:'tutorial-live-390',
                url:'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/tutorial.html?mode=start',
                viewport:{width:390,height:844},
                expect:'Step 1 / 10'
              }
            ];
            const report=[];
            for(const s of specs){
              const context=await browser.newContext({viewport:s.viewport,deviceScaleFactor:1});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push('pageerror: '+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
              await page.goto(s.url,{waitUntil:'networkidle',timeout:60000});
              const body=await page.locator('body').innerText();
              if(!body.includes(s.expect)) throw new Error(s.name+' expected text missing');
              const metrics=await page.evaluate(()=>({
                scrollWidth:document.documentElement.scrollWidth,
                clientWidth:document.documentElement.clientWidth
              }));
              if(metrics.scrollWidth>metrics.clientWidth+1) throw new Error(s.name+' horizontal overflow');
              if(errors.length) throw new Error(s.name+' console '+errors.join(' | '));
              await page.screenshot({
                path:`presentation-qa/manuals-v1.1/${s.name}.png`,
                fullPage:false
              });
              report.push({name:s.name,url:s.url,metrics,consoleErrors:errors,result:'PASS'});
              await context.close();
            }
            fs.writeFileSync(
              'presentation-qa/manuals-v1.1/PUBLIC_GUIDE_TUTORIAL_CAPTURE.json',
              JSON.stringify({items:report,result:'PASS'},null,2)
            );
            await browser.close();
            console.log('PUBLIC_GUIDE_TUTORIAL_CAPTURE=PASS');
          })();
          JS
          node capture-manual-web.js
          rm -f capture-manual-web.js

      - name: Generate QR assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import qrcode, json

          urls={
            'guide':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/guide.html',
            'tutorial':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/tutorial.html?mode=start',
            'owner':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/owner.html',
            'staff':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/staff.html',
            'customer':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/customer.html',
            'system-check':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/system-check.html',
            'demo':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/demo.html'
          }
          out=Path('manuals/assets')
          out.mkdir(parents=True,exist_ok=True)
          for name,url in urls.items():
              qr=qrcode.QRCode(
                  error_correction=qrcode.constants.ERROR_CORRECT_M,
                  box_size=10,
                  border=4
              )
              qr.add_data(url)
              qr.make(fit=True)
              qr.make_image(fill_color='black',back_color='white').save(out/f'qr-{name}.png')
          Path('presentation-qa/manuals-v1.1/QR_URL_MAP.json').write_text(
              json.dumps(urls,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          print('QR_ASSETS=7')
          PY

