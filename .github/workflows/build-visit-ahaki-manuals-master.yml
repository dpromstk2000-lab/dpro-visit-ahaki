      - name: Render exact PDF pages and verify no page overflow
        shell: bash
        run: |
          cat > render-manuals.js <<'JS'
          const { chromium } = require('playwright');
          const path=require('path');
          const fs=require('fs');

          async function render(browser, html, pdf, expectedPages){
            const page=await browser.newPage({viewport:{width:1200,height:1700}});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            await page.goto('file://'+path.resolve(html),{waitUntil:'load'});
            await page.waitForTimeout(600);

            const metrics=await page.evaluate(()=>[...document.querySelectorAll('.page')].map((p,i)=>({
              page:i+1,
              clientHeight:p.clientHeight,
              scrollHeight:p.scrollHeight,
              clientWidth:p.clientWidth,
              scrollWidth:p.scrollWidth
            })));
            if(metrics.length!==expectedPages) throw new Error(`${html} logical pages ${metrics.length}`);
            for(const m of metrics){
              if(m.scrollHeight>m.clientHeight+1) throw new Error(`${html} vertical overflow page ${m.page}: ${m.scrollHeight}/${m.clientHeight}`);
              if(m.scrollWidth>m.clientWidth+1) throw new Error(`${html} horizontal overflow page ${m.page}`);
            }
            if(errors.length) throw new Error(`${html} console: ${errors.join(' | ')}`);

            await page.emulateMedia({media:'print'});
            await page.pdf({
              path:pdf,
              format:'A4',
              printBackground:true,
              margin:{top:'0',right:'0',bottom:'0',left:'0'},
              preferCSSPageSize:true
            });
            await page.close();
            return metrics;
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const quick=await render(
              browser,
              'manuals/quick-start-master-v1.1.html',
              'DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf',
              3
            );
            const detailed=await render(
              browser,
              'manuals/detailed-manual-master-v1.1.html',
              'DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf',
              10
            );
            fs.writeFileSync(
              'presentation-qa/manuals-v1.1/HTML_PAGE_OVERFLOW_QA.json',
              JSON.stringify({quick,detailed,result:'PASS'},null,2)
            );
            await browser.close();
            console.log('MANUAL_PDF_RENDER=PASS');
          })();
          JS
          node render-manuals.js
          rm -f render-manuals.js

          test "$(pdfinfo DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf | awk '/^Pages:/ {print $2}')" = "3"
          test "$(pdfinfo DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf | awk '/^Pages:/ {print $2}')" = "10"

          cp DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf DPRO_VISIT_AHAKI_QUICK_START_V1.0_20260902.pdf
