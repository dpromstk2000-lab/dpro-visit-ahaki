              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto('http://127.0.0.1:4173/guide.html',{waitUntil:'networkidle'});
              const q=await page.evaluate(()=>({
                sw:document.documentElement.scrollWidth,
                cw:document.documentElement.clientWidth,
                quick:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf'),
                detailed:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf'),
                disabled:document.querySelectorAll('.guide-disabled').length
              }));
              if(q.sw>q.cw+1) throw new Error('Guide overflow '+width);
              if(!q.quick || !q.detailed || q.disabled!==0) throw new Error('Guide manual link state '+width);
              if(errors.length) throw new Error('Guide console '+width+': '+errors.join(' | '));
              results.push({width,...q,result:'PASS'});
              await context.close();
            }
            fs.writeFileSync(
              'presentation-qa/manuals-v1.1/GUIDE_MANUAL_LINK_QA.json',
              JSON.stringify({results,result:'PASS'},null,2)
            );
            await browser.close();
            console.log('GUIDE_MANUAL_LINK_QA=PASS');
          })();
          JS

          node qa-guide-manual-links.js
          rm -f qa-guide-manual-links.js
          kill "$(cat /tmp/manual-http.pid)" || true

