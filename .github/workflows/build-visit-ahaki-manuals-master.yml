      - name: Decode QR codes from final PDF renders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2, json

          URLS={
            'guide':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/guide.html',
            'tutorial':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/tutorial.html?mode=start',
            'owner':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/owner.html',
            'staff':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/staff.html',
            'customer':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/customer.html',
            'system-check':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/system-check.html',
            'demo':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/demo.html'
          }

          def decode(path):
              img=cv2.imread(str(path))
              det=cv2.QRCodeDetector()
              values=[]
              ok, decoded, points, _ = det.detectAndDecodeMulti(img)
              if ok:
                  values.extend([x for x in decoded if x])
              if not values:
                  one, pts, _ = det.detectAndDecode(img)
                  if one: values.append(one)
              return sorted(set(values))

          quick_expected=[
            [URLS['guide'],URLS['tutorial']],
            [URLS['owner']],
            [URLS['system-check'],URLS['demo']]
          ]
          detailed_expected=[
            [URLS['guide']],
            [URLS['tutorial']],
            [URLS['owner']],
            [URLS['owner']],
            [URLS['staff']],
            [URLS['customer']],
            [URLS['owner']],
            [URLS['system-check']],
            [URLS['guide']],
            [URLS['demo']]
          ]

          report={'quick':[],'detailed':[]}

          qpages=sorted(Path('/tmp/quick-qr').glob('page-*.png'))
          dpages=sorted(Path('/tmp/detailed-qr').glob('page-*.png'))
          assert len(qpages)==3, len(qpages)
          assert len(dpages)==10, len(dpages)

          for i,(p,expected) in enumerate(zip(qpages,quick_expected),1):
              values=decode(p)
              missing=[u for u in expected if u not in values]
              if missing:
                  raise SystemExit(f'Quick page {i} QR missing {missing}; decoded={values}')
              report['quick'].append({'page':i,'decoded':values,'expected':expected,'result':'PASS'})

          for i,(p,expected) in enumerate(zip(dpages,detailed_expected),1):
              values=decode(p)
              missing=[u for u in expected if u not in values]
              if missing:
                  raise SystemExit(f'Detailed page {i} QR missing {missing}; decoded={values}')
              report['detailed'].append({'page':i,'decoded':values,'expected':expected,'result':'PASS'})

          report['summary']={
            'quick_pages':'3/3',
            'quick_qr_instances':'5/5',
            'detailed_pages':'10/10',
            'detailed_qr_instances':'10/10',
            'result':'PASS'
          }
          Path('presentation-qa/manuals-v1.1/FINAL_RENDER_QR_QA.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          print('QUICK_FINAL_RENDER_QR=5/5 PASS')
          print('DETAILED_FINAL_RENDER_QR=10/10 PASS')
          PY

      - name: Build preview contact sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          def contact(paths, out, cols, width=360, pad=18):
              imgs=[]
              for p in paths:
                  im=Image.open(p).convert('RGB')
                  ratio=width/im.width
                  im=im.resize((width,int(im.height*ratio)))
                  im=ImageOps.expand(im,border=2,fill='#d8e5e0')
                  imgs.append(im)
              rows=(len(imgs)+cols-1)//cols
              cell_w=max(i.width for i in imgs)+pad*2
              cell_h=max(i.height for i in imgs)+pad*2
              sheet=Image.new('RGB',(cell_w*cols,cell_h*rows),'white')
              for idx,im in enumerate(imgs):
                  x=(idx%cols)*cell_w+pad
                  y=(idx//cols)*cell_h+pad
                  sheet.paste(im,(x,y))
              sheet.save(out,optimize=True)

          quick=sorted(Path('presentation-qa/manuals-v1.1/quick-pages').glob('page-*.png'))
          detailed=sorted(Path('presentation-qa/manuals-v1.1/detailed-pages').glob('page-*.png'))
          contact(quick,'DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_PREVIEW.png',3,width=320)
          contact(detailed,'DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_PREVIEW.png',5,width=230)
          print('PREVIEW_CONTACT_SHEETS=PASS')
          PY

