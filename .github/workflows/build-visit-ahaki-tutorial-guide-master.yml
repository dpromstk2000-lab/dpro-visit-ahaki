                    <div class="first10-item"><b>10</b>System Check</div>
                  </div>
                </section>

                <section class="guide-group" data-group="owner">
                  <h2>Owner / Office</h2>
                  <p>事務所で毎日確認する入口です。</p>
                  <ul class="guide-list">
                    <li>今日の訪問・未割当・未記録・未連絡</li>
                    <li>変更前の影響確認</li>
                    <li>今月の請求準備</li>
                    <li>健康情報を含めない安全な家族連絡</li>
                  </ul>
                  <div class="guide-links"><a class="guide-link" href="owner.html">Owner / Office画面</a></div>
                </section>

                <section class="guide-group" data-group="staff">
                  <h2>Staff</h2>
                  <p>施術者は自分に割り当てられた訪問だけを確認します。</p>
                  <ul class="guide-list">
                    <li>本日の担当訪問</li>
                    <li>到着・施術記録・完了</li>
                    <li>必要な訪問先情報の確認</li>
                  </ul>
                  <div class="guide-links"><a class="guide-link" href="staff.html">Staff画面</a></div>
                </section>

                <section class="guide-group" data-group="patient-family">
                  <h2>Patient / Family</h2>
                  <p>患者本人と家族代理を分け、必要な範囲だけを表示します。</p>
                  <ul class="guide-list">
                    <li>患者本人の訪問予定</li>
                    <li>家族代理は同意範囲を超える施術メモを見ない</li>
