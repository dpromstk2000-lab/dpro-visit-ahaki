            'result':'GREEN_WITH_MANUAL_LINK_HOLD',
            'complete_final_lock':'HOLD'
          }
          summary['sha256']={
            'guide.html':hashlib.sha256(Path('guide.html').read_bytes()).hexdigest(),
            'tutorial.html':hashlib.sha256(Path('tutorial.html').read_bytes()).hexdigest()
          }
          Path('presentation-qa/TUTORIAL_GUIDE_MASTER_QA_V1.1.json').write_text(
            json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Commit Tutorial Guide master artifacts
        shell: bash
        run: |
          set -eux
          rm -rf node_modules package.json package-lock.json
          git rm .github/workflows/build-visit-ahaki-tutorial-guide-master.yml
          git config user.name "DPRO SYSTEM FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add guide.html tutorial.html \
            presentation-qa/TUTORIAL_GUIDE_STATIC_QA_V1.1.json \
            presentation-qa/TUTORIAL_GUIDE_BROWSER_QA_V1.1.json \
            presentation-qa/TUTORIAL_GUIDE_MASTER_QA_V1.1.json \
            presentation-qa/tutorial-guide-v1.1

          git diff --cached --name-only | tee /tmp/staged.txt
          python - <<'PY'
          from pathlib import Path
          paths=set(Path('/tmp/staged.txt').read_text().splitlines())
          allowed={
            '.github/workflows/build-visit-ahaki-tutorial-guide-master.yml',
            'guide.html','tutorial.html',
            'presentation-qa/TUTORIAL_GUIDE_STATIC_QA_V1.1.json',
            'presentation-qa/TUTORIAL_GUIDE_BROWSER_QA_V1.1.json',
            'presentation-qa/TUTORIAL_GUIDE_MASTER_QA_V1.1.json'
          }
          for p in paths:
              if p.startswith('presentation-qa/tutorial-guide-v1.1/'): continue
              if p not in allowed: raise SystemExit(f'Unexpected staged path: {p}')
          PY

          git commit -m "Align VISIT AHAKI Tutorial and Guide Center with master"
          git push
