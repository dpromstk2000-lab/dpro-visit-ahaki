            lp.html flyer-visit-ahaki.html DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf \
            app.js config.js owner.html staff.html customer.html demo.html system-check.html styles.css \
            DPRO_VISIT_AHAKI_QUICK_START_V1.0_20260902.pdf \
            DPRO_VISIT_AHAKI_DETAILED_MANUAL_V1.0_20260902.pdf \
            | diff - /tmp/frozen-before.sha256
          echo PRESENTATION_SYSTEM_FROZEN_SCOPE=PASS

