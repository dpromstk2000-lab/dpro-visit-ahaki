name: Build VISIT AHAKI Tutorial Guide Master V1.2

on:
  push:
    paths:
      - ".github/workflows/build-visit-ahaki-tutorial-guide-master.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Freeze approved presentation and SYSTEM scope
        shell: bash
        run: |
          set -eux
          test "$(sha256sum lp.html | awk '{print $1}')" = "60d6a1777a4ad87855628bcd07a7847583dcf5a810ab86be4e8269906ee6c5e7"
          test "$(sha256sum flyer-visit-ahaki.html | awk '{print $1}')" = "4b3375973ddc87b07610d98478bb202ccb0c09bc2352b5f836bc92f9377c1865"
          test "$(sha256sum DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf | awk '{print $1}')" = "e15295bf9b7709463f34f18eb79892fa24c019c3ed7e7e1dee7687462d4b0091"
          test "$(sha256sum guide.html | awk '{print $1}')" = "3e4873586f3a464b4faf1664ba97eec8d371d3163f655f449d2364a0aec4791a"
          test "$(sha256sum tutorial.html | awk '{print $1}')" = "aba37a2e83876046adcb8034c1cc07345886a66b402fdae5d0b2a00621a009c5"
          test "$(sha256sum DPRO_VISIT_AHAKI_QUICK_START_V1.0_20260902.pdf | awk '{print $1}')" = "5c56f8c589891b1cab80fa9734f29a502b244176dda5c55f6b7bcc84d93363ac"
          test "$(sha256sum DPRO_VISIT_AHAKI_DETAILED_MANUAL_V1.0_20260902.pdf | awk '{print $1}')" = "716b50e76cf4470c4892a7310ffc5509370a8d5ea7c9ec19e0f278eeb1250399"

          sha256sum \
            lp.html flyer-visit-ahaki.html DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf \
            app.js config.js owner.html staff.html customer.html demo.html system-check.html styles.css \
            DPRO_VISIT_AHAKI_QUICK_START_V1.0_20260902.pdf \
            DPRO_VISIT_AHAKI_DETAILED_MANUAL_V1.0_20260902.pdf \
            > /tmp/frozen-before.sha256

      - name: Build Guide Center and First10
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guide = """<!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
