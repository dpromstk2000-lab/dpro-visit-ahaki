name: VISIT AHAKI Tutorial Navigation V1.2.2 QA

on:
  push:
    paths:
      - ".github/workflows/visit-ahaki-tutorial-navigation-v122-qa.yml"

permissions:
  contents: read

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://dpromstk2000-lab.github.io/dpro-visit-ahaki
      BASELINE_HEAD: dca2117dfd366fb513ab5954c446e0dbfb1012f0
      EVIDENCE_DIR: tutorial-navigation-qa-v1.2.2

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected baseline and no-touch surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse "$BASELINE_HEAD")" = "$BASELINE_HEAD"
          test "$(git rev-parse HEAD:tutorial.html)" != "$(git rev-parse "$BASELINE_HEAD:tutorial.html")"
          grep -Fq 'data-tutorial-contract="1.2.2"' tutorial.html
          for path in guide.html demo.html owner.html staff.html customer.html system-check.html app.js config.js styles.css; do
            test "$(git rev-parse "$BASELINE_HEAD:$path")" = "$(git rev-parse "HEAD:$path")"
          done
          git diff --name-only "$BASELINE_HEAD" HEAD | sort > "$EVIDENCE_DIR/CHANGED_FILES_AT_QA.txt"
          unexpected="$(grep -vE '^(tutorial\.html|\.github/workflows/visit-ahaki-tutorial-navigation-v122-qa\.yml)$' "$EVIDENCE_DIR/CHANGED_FILES_AT_QA.txt" || true)"
          test -z "$unexpected"
          {
            echo "NO_CORE_CHANGE=PASS"
            echo "baseline=$BASELINE_HEAD"
            echo "qa_head=$GITHUB_SHA"
            for path in guide.html demo.html owner.html staff.html customer.html system-check.html app.js config.js styles.css; do
              echo "$path=$(git rev-parse HEAD:$path)"
            done
          } > "$EVIDENCE_DIR/NO_CORE_CHANGE_EVIDENCE.txt"

      - name: Wait for public Tutorial V1.2.2
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 48); do
            if curl -fsSL --retry 2 --retry-delay 1 "$BASE_URL/tutorial.html?qa=${GITHUB_SHA}-${attempt}" -o /tmp/public-tutorial.html; then
              if grep -Fq 'data-tutorial-contract="1.2.2"' /tmp/public-tutorial.html; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"
          {
            echo "PUBLIC_TUTORIAL_V1.2.2=PASS"
            echo "url=$BASE_URL/tutorial.html"
            echo "qa_head=$GITHUB_SHA"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$EVIDENCE_DIR/GITHUB_PAGES_EVIDENCE.txt"

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Restore and run Tutorial Navigation V1.2.2 runtime QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = '.github/workflows/visit-ahaki-tutorial-navigation-v122-qa.yml'
          source = subprocess.check_output(['git','show',f'HEAD^:{path}'], text=True)
          marker = 'cat > "$GITHUB_WORKSPACE/.tutorial-v122-qa.js" <<\'JS\''
          marker_pos = source.find(marker)
          if marker_pos < 0:
              raise SystemExit('Previous runtime QA script marker not found')
          start = source.find('\n', marker_pos) + 1
          end = source.find('\n          JS\n', start)
          if end < 0:
              raise SystemExit('Previous runtime QA script terminator not found')
          body = source[start:end]
          lines = body.splitlines()
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          out = Path('.tutorial-v122-qa.js')
          out.write_text(body, encoding='utf-8')
          print('RESTORED_RUNTIME_QA_BYTES=' + str(out.stat().st_size))
          PY
          node --check "$GITHUB_WORKSPACE/.tutorial-v122-qa.js"
          node "$GITHUB_WORKSPACE/.tutorial-v122-qa.js"

      - name: Build QA summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/.tutorial-v122-qa.js"
          test -s "$EVIDENCE_DIR/GITHUB_PAGES_EVIDENCE.txt"
          test -s "$EVIDENCE_DIR/TUTORIAL_TARGET_MAP.json"
          test -s "$EVIDENCE_DIR/TUTORIAL_RUNTIME_QA.json"
          test -s "$EVIDENCE_DIR/GUIDE_CENTER_RUNTIME_QA.json"
          test -s "$EVIDENCE_DIR/TARGET_MISSING_RECOVERY.json"
          test -s "$EVIDENCE_DIR/MUTATION_ZERO.txt"
          test -s "$EVIDENCE_DIR/mobile-step-01.png"
          test -s "$EVIDENCE_DIR/mobile-cross-page-step-06.png"
          test -s "$EVIDENCE_DIR/desktop-step-01.png"
          test -s "$EVIDENCE_DIR/desktop-cross-page-step-06.png"
          test -s "$EVIDENCE_DIR/TARGET_MISSING-recovery.png"
          {
            echo "DPRO #52 VISIT_AHAKI Tutorial Navigation V1.2.2"
            echo "RESULT=PASS"
            echo "BASELINE_HEAD=$BASELINE_HEAD"
            echo "QA_HEAD=$GITHUB_SHA"
            echo "FIRST10=10"
            echo "TARGET_MISSING_BLOCKING=PASS"
            echo "BUSINESS_MUTATION=0"
            echo "AUTO_LOGIN=0"
            echo "VIEWPORTS=375,390,430,768,1440"
          } > "$EVIDENCE_DIR/QA_SUMMARY.txt"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_52_VISIT_AHAKI_TUTORIAL_NAVIGATION_V1.2.2_QA
          path: tutorial-navigation-qa-v1.2.2
          if-no-files-found: error
          retention-days: 30
