      - name: Rebuild preview contact sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          def sheet(paths, out, cols, width, pad=18):
              imgs = []
              for p in paths:
                  im = Image.open(p).convert('RGB')
                  ratio = width / im.width
                  im = im.resize((width, int(im.height * ratio)))
                  imgs.append(ImageOps.expand(im, border=2, fill='#d8e5e0'))

              rows = (len(imgs) + cols - 1) // cols
              cw = max(i.width for i in imgs) + pad*2
              ch = max(i.height for i in imgs) + pad*2
              canvas = Image.new('RGB', (cw*cols, ch*rows), 'white')

              for n, im in enumerate(imgs):
                  canvas.paste(im, ((n%cols)*cw + pad, (n//cols)*ch + pad))

              canvas.save(out, optimize=True)

          q = sorted(Path('presentation-qa/manuals-copy-clean-v1.3/quick-pages').glob('page-*.png'))
          d = sorted(Path('presentation-qa/manuals-copy-clean-v1.3/detailed-pages').glob('page-*.png'))

          sheet(q, 'DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_PREVIEW.png', 3, 320)
          sheet(d, 'DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_PREVIEW.png', 5, 230)
          print('PREVIEW_REBUILD_V1.3=PASS')
          PY

