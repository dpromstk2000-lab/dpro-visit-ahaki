      - name: Static public-copy guard
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('style','script'):
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ('style','script') and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          banned = [
              'exactly 10','Tutorial state','System identity','Runtime',
              'Auth boundary','Production Guard','tenant','Owner Auth','顧客Auth',
              'scope','Binding','versioned','READY工程','契約後READY',
              'Post-contract settings','field role','safe notification boundary',
              'Claim Readiness','Impact Preflight',
              'Current public LIVE screen evidence only','MASTER V1.1','A4 portrait'
          ]
          required = [
              'First10 全10ステップ','現在公開中の実画面を掲載',
              '安全な利用範囲','お客様専用環境',
              'First10 - 全10ステップ','変更前の影響確認',
              '更新履歴を保持する運用','同意範囲',
              '安全な家族連絡','本番の安全設定',
              '契約後に設定する項目'
          ]

          report = {}
          combined = ''
          for path in [
              'manuals/quick-start-master-v1.1.html',
              'manuals/detailed-manual-master-v1.1.html'
          ]:
              parser = VisibleText()
              parser.feed(Path(path).read_text(encoding='utf-8'))
              text = ' '.join(' '.join(parser.parts).split())
              combined += ' ' + text
              hits = [x for x in banned if x in text]
              report[path] = {'banned_hits': hits, 'chars': len(text)}
              if hits:
                  raise SystemExit(f'{path}: public internal terms remain: {hits}')

          missing = [x for x in required if x not in combined]
          if missing:
              raise SystemExit(f'required cleaned copy missing: {missing}')

          out = Path('presentation-qa/manuals-copy-clean-v1.3')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'PUBLIC_COPY_SOURCE_QA.json').write_text(
              json.dumps(
                  {'files': report, 'banned_count': 0, 'required': required, 'result': 'PASS'},
                  ensure_ascii=False, indent=2
              ),
              encoding='utf-8'
          )
          print('PUBLIC_COPY_SOURCE_QA_V1.3=PASS')
          PY

      - name: Install render and QR QA dependencies
        shell: bash
        run: |
          set -eux
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          python -m pip install --quiet pillow opencv-python-headless pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p presentation-qa/manuals-copy-clean-v1.3/quick-pages
          mkdir -p presentation-qa/manuals-copy-clean-v1.3/detailed-pages
          mkdir -p /tmp/quick-qr-v13 /tmp/detailed-qr-v13

      - name: Render PDFs and verify logical page overflow
        shell: bash
        run: |
          cat > render-manual-v13.js <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          const fs = require('fs');

          async function render(browser, html, pdf, expectedPages) {
            const page = await browser.newPage({viewport:{width:1200,height:1700}});
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()) });

            await page.goto('file://' + path.resolve(html), {waitUntil:'load'});
            await page.waitForTimeout(500);

            const metrics = await page.evaluate(() =>
              [...document.querySelectorAll('.page')].map((p, i) => ({
                page:i+1,
                clientHeight:p.clientHeight,
                scrollHeight:p.scrollHeight,
                clientWidth:p.clientWidth,
                scrollWidth:p.scrollWidth
              }))
            );

            if (metrics.length !== expectedPages)
              throw new Error(`page count ${html}: ${metrics.length} expected ${expectedPages}`);

            for (const m of metrics) {
              if (m.scrollHeight > m.clientHeight + 1)
                throw new Error(`vertical overflow ${html} p${m.page}`);
              if (m.scrollWidth > m.clientWidth + 1)
                throw new Error(`horizontal overflow ${html} p${m.page}`);
            }
            if (errors.length) throw new Error(errors.join(' | '));

            await page.emulateMedia({media:'print'});
            await page.pdf({
              path:pdf,
              format:'A4',
              printBackground:true,
              preferCSSPageSize:true,
              margin:{top:'0',right:'0',bottom:'0',left:'0'}
            });
            await page.close();
            return metrics;
          }

          (async () => {
            const browser = await chromium.launch({headless:true});
            const quick = await render(
              browser,
              'manuals/quick-start-master-v1.1.html',
              'DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf',
              3
            );
            const detailed = await render(
              browser,
              'manuals/detailed-manual-master-v1.1.html',
              'DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf',
              10
            );
            fs.writeFileSync(
              'presentation-qa/manuals-copy-clean-v1.3/PAGE_OVERFLOW_QA.json',
              JSON.stringify({quick,detailed,result:'PASS'}, null, 2)
            );
            await browser.close();
            console.log('MANUAL_V1.3_PDF_RENDER=PASS');
          })();
          JS

          node render-manual-v13.js
          rm -f render-manual-v13.js

          test "$(pdfinfo DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf | awk '/^Pages:/ {print $2}')" = "3"
          test "$(pdfinfo DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf | awk '/^Pages:/ {print $2}')" = "10"

