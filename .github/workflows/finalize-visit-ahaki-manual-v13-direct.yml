          from pathlib import Path
          from pypdf import PdfReader
          import json, hashlib

          q = 'DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf'
          d = 'DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf'

