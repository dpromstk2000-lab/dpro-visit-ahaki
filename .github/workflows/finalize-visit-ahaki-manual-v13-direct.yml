      - name: Render every page and decode final PDF QR
        shell: bash
        run: |
          set -eux
          rm -f presentation-qa/manuals-copy-clean-v1.3/quick-pages/*.png
          rm -f presentation-qa/manuals-copy-clean-v1.3/detailed-pages/*.png
          rm -f /tmp/quick-qr-v13/*.png /tmp/detailed-qr-v13/*.png

