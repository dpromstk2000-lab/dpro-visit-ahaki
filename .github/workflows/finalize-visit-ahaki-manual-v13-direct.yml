            DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf \
            /tmp/quick-qr-v13/page >/dev/null 2>&1
          pdftoppm -png -r 300 \
            DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf \
            /tmp/detailed-qr-v13/page >/dev/null 2>&1

          test "$(find presentation-qa/manuals-copy-clean-v1.3/quick-pages -name '*.png' | wc -l)" = "3"
          test "$(find presentation-qa/manuals-copy-clean-v1.3/detailed-pages -name '*.png' | wc -l)" = "10"

          python - <<'PY'
          from pathlib import Path
          import cv2, json

          U = {
              'guide':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/guide.html',
              'tutorial':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/tutorial.html?mode=start',
              'owner':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/owner.html',
              'staff':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/staff.html',
              'customer':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/customer.html',
              'system':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/system-check.html',
              'demo':'https://dpromstk2000-lab.github.io/dpro-visit-ahaki/demo.html'
          }
          qexp = [
              [U['guide'],U['tutorial']],
              [U['owner']],
              [U['system'],U['demo']]
          ]
          dexp = [
              [U['guide']],
              [U['tutorial']],
              [U['owner']],
              [U['owner']],
              [U['staff']],
              [U['customer']],
              [U['owner']],
              [U['system']],
              [U['guide']],
              [U['demo']]
          ]

          def decode(p):
              im = cv2.imread(str(p))
              detector = cv2.QRCodeDetector()
              vals = []
              ok, decoded, pts, _ = detector.detectAndDecodeMulti(im)
              if ok:
                  vals += [x for x in decoded if x]
              if not vals:
                  one, _, _ = detector.detectAndDecode(im)
                  if one:
                      vals.append(one)
              return sorted(set(vals))

          report = {'quick':[], 'detailed':[]}
          quick_pages = sorted(Path('/tmp/quick-qr-v13').glob('page-*.png'))
          detailed_pages = sorted(Path('/tmp/detailed-qr-v13').glob('page-*.png'))

          if len(quick_pages) != 3 or len(detailed_pages) != 10:
              raise SystemExit(f'QR render page count mismatch quick={len(quick_pages)} detailed={len(detailed_pages)}')

          for i, (p, exp) in enumerate(zip(quick_pages, qexp), 1):
              vals = decode(p)
              miss = [u for u in exp if u not in vals]
              if miss:
                  raise SystemExit(f'quick p{i} missing {miss}, decoded={vals}')
              report['quick'].append({'page':i,'decoded':vals,'result':'PASS'})

          for i, (p, exp) in enumerate(zip(detailed_pages, dexp), 1):
              vals = decode(p)
              miss = [u for u in exp if u not in vals]
              if miss:
                  raise SystemExit(f'detailed p{i} missing {miss}, decoded={vals}')
              report['detailed'].append({'page':i,'decoded':vals,'result':'PASS'})

          report['summary'] = {
              'quick':'5/5 PASS',
              'detailed':'10/10 PASS',
              'result':'PASS'
          }
          Path('presentation-qa/manuals-copy-clean-v1.3/FINAL_RENDER_QR_QA.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          print('FINAL_RENDER_QR_QA_V1.3=PASS')
          PY

