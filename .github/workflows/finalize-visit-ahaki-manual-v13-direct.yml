      - name: Commit V1.3 manual artifacts only
        shell: bash
        run: |
          set -eux
          rm -rf node_modules package.json package-lock.json
          git config user.name "DPRO SYSTEM FACTORY"
          git config user.email "actions@users.noreply.github.com"

          git add \
            manuals/quick-start-master-v1.1.html \
            manuals/detailed-manual-master-v1.1.html \
            DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf \
            DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf \
            DPRO_VISIT_AHAKI_QUICK_START_V1.0_20260902.pdf \
            DPRO_VISIT_AHAKI_DETAILED_MANUAL_V1.0_20260902.pdf \
            DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_PREVIEW.png \
            DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_PREVIEW.png \
            presentation-qa/manuals-copy-clean-v1.3

          git diff --cached --name-only | tee /tmp/staged.txt

          python - <<'PY'
          from pathlib import Path

          paths = set(Path('/tmp/staged.txt').read_text().splitlines())
          fixed = {
              'manuals/quick-start-master-v1.1.html',
              'manuals/detailed-manual-master-v1.1.html',
              'DPRO_VISIT_AHAKI_QUICK_START_MASTER_V1.1_20260904.pdf',
              'DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_20260904.pdf',
