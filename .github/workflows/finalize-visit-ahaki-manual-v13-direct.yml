              'DPRO_VISIT_AHAKI_DETAILED_MANUAL_MASTER_V1.1_PREVIEW.png'
          }

          for p in paths:
              if p in fixed:
                  continue
              if p.startswith('presentation-qa/manuals-copy-clean-v1.3/'):
                  continue
              raise SystemExit(f'Unexpected staged path: {p}')
          PY

          git commit -m "Finalize VISIT AHAKI Manual public copy V1.3"
          git push
