              .desc{color:var(--muted);font-size:17px;max-width:820px}
              .hero{padding:0;background:var(--deep);color:#fff}
              .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;min-height:680px}
              .hero-copy{padding:82px 54px 76px max(32px,calc((100vw - 1120px)/2))}
              .hero .kicker{color:#76e7be}
              h1{font-size:clamp(44px,6.5vw,78px);line-height:1.08;letter-spacing:-.055em;margin:14px 0 24px}
              .hero-lead{font-size:clamp(17px,2vw,21px);color:#d5e4de;max-width:720px}
              .hero-photo{position:relative;min-height:520px;overflow:hidden}
              .hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center}
              .hero-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#071a1594 0%,transparent 45%)}
              .photo-credit{position:absolute;right:14px;bottom:12px;z-index:2;background:#071a15cc;color:#dcebe5;padding:6px 9px;border-radius:8px;font-size:10px}
              .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
              .btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;border-radius:12px;text-decoration:none;font-weight:950;border:1px solid transparent}
              .btn.primary{background:var(--mint);color:#052018}
              .btn.light{background:#fff;color:var(--deep)}
              .btn.outline{border-color:#ffffff55;color:#fff}
              .soft{background:var(--soft)}
              .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px}
              .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
              .card .num{color:var(--green);font-size:12px;font-weight:950;letter-spacing:.12em}
              .card h3{font-size:20px;line-height:1.3;margin:8px 0}
              .card p{font-size:14px;color:var(--muted);margin:0}
              .six{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
              .six .card{min-height:175px}
              .diagram{margin-top:28px;border-radius:24px;background:linear-gradient(135deg,#071a15,#0d3026);color:#fff;padding:28px}
              .diagram-title{font-size:clamp(26px,4vw,40px);font-weight:950;margin-bottom:24px}
              .diagram-title span{color:#68e7b8}
              .diagram-grid{display:grid;grid-template-columns:1fr 58px .8fr 58px 1.25fr;gap:12px;align-items:stretch}
              .entry-grid{display:grid;gap:10px}
              .entry,.hub,.manage{border-radius:16px;padding:18px}
              .entry{border:1px solid #ffffff26;background:#ffffff0d}
              .entry small{display:block;color:#76e7be;font-weight:950;letter-spacing:.1em;font-size:10px}
              .entry strong{display:block;margin-top:5px}
              .arrow{display:grid;place-items:center;color:#68e7b8;font-size:34px}
              .hub{background:var(--mint);color:#062218;display:flex;flex-direction:column;justify-content:center;text-align:center}
              .hub small{font-weight:950;letter-spacing:.12em}.hub strong{font-size:26px}.hub span{font-size:12px;font-weight:850}
              .manage{background:#f0fbf6;color:var(--ink);border:1px solid #7ad9b4}
              .manage b{display:block;margin-bottom:8px}
              .manage ul{padding-left:18px;margin:0;color:#39574d}
              .roles{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
              .role{border:1px solid var(--line);border-radius:20px;padding:24px;background:#fff}
              .role h3{font-size:24px;margin:0 0 12px}
              .role ul{margin:0;padding-left:20px;color:var(--muted)}
              .beforeafter{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
              .ba{padding:28px;border-radius:20px;border:1px solid var(--line);background:#fff}
              .ba.after{background:#eaf9f3;border-color:#b9e6d4}
              .ba h3{font-size:26px;margin:0 0 16px}
              .ba ul{padding-left:20px}
              .pricebox{background:#0d332a;color:#fff;border-radius:26px;padding:34px;margin-top:28px;display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center}
