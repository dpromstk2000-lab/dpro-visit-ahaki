name: Build VISIT AHAKI LP3 and A4 MASTER V2.0

on:
  push:
    paths:
      - ".github/workflows/build-visit-ahaki-lp3-a4-master.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install build and QA tools
        shell: bash
        run: |
          set -eux
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          python -m pip install --quiet beautifulsoup4 qrcode pillow opencv-python-headless pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p presentation presentation-qa

      - name: Lock approved industry photos
        shell: bash
        run: |
          set -eux
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://images.pexels.com/photos/8313174/pexels-photo-8313174.jpeg?auto=compress&cs=tinysrgb&w=1800' \
            -o presentation/visit-ahaki-industry-acupuncture.jpg
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://images.pexels.com/photos/7235059/pexels-photo-7235059.jpeg?auto=compress&cs=tinysrgb&w=1800' \
            -o presentation/visit-ahaki-industry-massage-senior.jpg
          file presentation/*.jpg
          test "$(stat -c%s presentation/visit-ahaki-industry-acupuncture.jpg)" -gt 50000
          test "$(stat -c%s presentation/visit-ahaki-industry-massage-senior.jpg)" -gt 50000
          cat > presentation/PHOTO_SOURCES.txt <<'TXT'
          P1 / A4
          https://www.pexels.com/photo/a-therapist-doing-an-acupuncture-treatment-8313174/
          Creator: RDNE Stock project / Pexels
          Pexels page status at selection: Free to use

          P10
          https://www.pexels.com/photo/a-woman-massaging-an-elderly-woman-7235059/
          Creator: cottonbro studio / Pexels
          Pexels page status at selection: Free to use
          TXT

      - name: Capture current public LIVE screens for P9
        shell: bash
        run: |
          cat > capture-presentation-live.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const crypto = require('crypto');
          const BASE='https://dpromstk2000-lab.github.io/dpro-visit-ahaki/';
          const out='presentation';
          const manifest={capturedAt:new Date().toISOString(),source:'CURRENT_PUBLIC_LIVE',items:[],errors:[]};

          async function shot(browser,spec){
            const context=await browser.newContext({viewport:spec.viewport,deviceScaleFactor:1});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            const url=BASE+spec.path;
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(1000);
            if(spec.click){
              await page.locator(spec.click).click({timeout:15000});
              await page.waitForTimeout(3200);
            }
            const body=await page.locator('body').innerText();
            if(!body.includes(spec.assertText)) throw new Error(spec.name+' expected text missing: '+spec.assertText);
            const metrics=await page.evaluate(()=>({
              scrollWidth:document.documentElement.scrollWidth,
              clientWidth:document.documentElement.clientWidth,
              scrollHeight:document.documentElement.scrollHeight,
              title:document.title
            }));
            if(metrics.scrollWidth>metrics.clientWidth+1) throw new Error(spec.name+' horizontal overflow');
            const path=`${out}/${spec.name}.png`;
            await page.screenshot({path,fullPage:true});
            const bytes=fs.readFileSync(path);
            manifest.items.push({
              name:spec.name,url,viewport:spec.viewport,
              sha256:crypto.createHash('sha256').update(bytes).digest('hex'),
              metrics,consoleErrors:errors,
              safeAction:spec.safeAction||'none',
              businessMutation:0
            });
            if(errors.length) manifest.errors.push({name:spec.name,errors});
            await context.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const specs=[
              {name:'live-demo-desktop',path:'demo.html',viewport:{width:1440,height:1000},assertText:'SYNTHETIC DEMO'},
              {name:'live-owner-desktop',path:'owner.html',viewport:{width:1440,height:1100},click:'#loginOwner',assertText:'Visit Day Control Tower',safeAction:'Owner demo session login only'},
              {name:'live-staff-mobile',path:'staff.html',viewport:{width:390,height:844},click:'#login',assertText:'本日の担当訪問',safeAction:'Staff demo session login only'},
              {name:'live-family-mobile',path:'customer.html',viewport:{width:390,height:844},click:'#family',assertText:'訪問予定',safeAction:'Family demo session login only'},
              {name:'live-system-check',path:'system-check.html',viewport:{width:1440,height:1100},assertText:'System Check',safeAction:'GET only'}
            ];
            for(const s of specs){
              try{ await shot(browser,s); }
              catch(e){ manifest.errors.push({name:s.name,errors:[String(e.stack||e)]}); }
            }
            await browser.close();
            fs.writeFileSync('presentation/LIVE_SCREEN_MANIFEST.json',JSON.stringify(manifest,null,2));
            if(manifest.items.length!==5 || manifest.errors.length) {
              console.error(JSON.stringify(manifest,null,2));
              process.exit(2);
            }
          })();
          JS
          node capture-presentation-live.js
          rm -f capture-presentation-live.js

      - name: Build LP P1-P10 MASTER V1.4
        shell: bash
        run: |
          cat > lp.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
