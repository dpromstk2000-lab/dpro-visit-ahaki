              *{box-sizing:border-box}
              html{scroll-behavior:smooth}
              body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:#fff;line-height:1.75}
