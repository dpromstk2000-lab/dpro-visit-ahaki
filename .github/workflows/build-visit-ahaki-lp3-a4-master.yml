              .consult-copy{padding:70px max(32px,calc((100vw - 1120px)/2)) 65px 54px}
              .consult-copy .kicker{color:#74e6bb}
              .consult-copy p{color:#d6e5df}
              footer{background:#071a15;color:#b8cec5;padding:26px 0;font-size:12px}
              @media(max-width:900px){
                .nav a:not(.cta){display:none}
                .hero-grid,.consult-grid,.pricebox,.screens,.roles,.beforeafter{grid-template-columns:1fr}
