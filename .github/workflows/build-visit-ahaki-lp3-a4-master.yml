              .guard{background:#fff7e8;color:#5d4729;border:1px solid #ead6aa;border-radius:14px;padding:14px;font-size:13px}
              .screens{display:grid;grid-template-columns:1.45fr .75fr;gap:16px;margin-top:28px}
