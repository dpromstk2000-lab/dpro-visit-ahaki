      - name: Render LP responsive QA and A4 PDF
        shell: bash
        run: |
          cat > render-and-qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const path=require('path');
          const widths=[375,390,430,768,1280,1440];

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const base='file://'+path.resolve('.');

            const lpResults=[];
            for(const width of widths){
              const page=await browser.newPage({viewport:{width,height:1000}});
              const errs=[];
              page.on('pageerror',e=>errs.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
              await page.goto(base+'/lp.html',{waitUntil:'load'});
              await page.waitForTimeout(500);
              const q=await page.evaluate(()=>{
                const de=document.documentElement;
                const controls=[...document.querySelectorAll('a.btn,.nav .cta')];
                return {
                  scrollWidth:de.scrollWidth,clientWidth:de.clientWidth,
                  minControlHeight:Math.min(...controls.map(x=>x.getBoundingClientRect().height)),
                  sections:[...document.querySelectorAll('main>section')].map(x=>x.id)
                };
              });
              if(q.scrollWidth>q.clientWidth+1) throw new Error('LP overflow '+width);
              if(q.minControlHeight<44) throw new Error('LP control <44 '+width+' '+q.minControlHeight);
              if(errs.length) throw new Error('LP console '+width+' '+errs.join(' | '));
              await page.screenshot({path:`presentation-qa/lp-${width}.png`,fullPage:true});
              lpResults.push({width,...q,errors:errs});
              await page.close();
            }

            const page=await browser.newPage({viewport:{width:1200,height:1700}});
            await page.goto(base+'/flyer-visit-ahaki.html',{waitUntil:'load'});
            await page.emulateMedia({media:'print'});
            await page.pdf({
              path:'DPRO_VISIT_AHAKI_A4_FLYER_V1.0_20260902.pdf',
              format:'A4',
              printBackground:true,
              margin:{top:'0',right:'0',bottom:'0',left:'0'}
            });
            await page.emulateMedia({media:'screen'});
            await page.screenshot({path:'presentation-qa/a4-screen-preview.png',fullPage:true});
            fs.writeFileSync('presentation-qa/LP_RESPONSIVE_QA.json',JSON.stringify(lpResults,null,2));
            await browser.close();
          })();
          JS
