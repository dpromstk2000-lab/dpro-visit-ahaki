<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner | DPRO 訪問マッサージ・鍼灸</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="bar"><div class="brand">DPRO 訪問マッサージ・鍼灸 / Owner</div><nav class="nav"><a href="demo.html">DEMO</a><a href="staff.html">Staff</a><a href="customer.html">Patient</a><a href="system-check.html">Check</a></nav></div></header><main><h1>今日の訪問</h1><p class="lead">危ない予定、未記録、未連絡、Claim blockerを訪問単位で追います。Office表示では施術メモを出しません。</p><div class="actions"><button id="loginOwner">Ownerで開始</button><button class="secondary" id="loginOffice">Officeで開始</button><button class="secondary" id="reset">Demo Reset</button></div><div id="status" class="notice">デモ役割を選択してください。</div><section id="summary" class="grid" aria-live="polite"></section><section><h2>Visit Day Control Tower</h2><div id="visits" class="grid"></div></section><section class="card"><h2>継続予定・変更Impact Preflight</h2><p class="muted">最初の訪問を30分後へ動かす想定で、担当衝突・施設人数区分・通知・Claim再確認をcommit前に検出します。</p><div class="actions"><button id="preflight">Impactを確認</button><button id="claim" class="secondary">今月のClaim Readiness</button></div><pre id="detail">未実行</pre></section></main><script src="config.js"></script><script src="app.js"></script><script>
const $=s=>document.querySelector(s), S=$('#status'), visits=$('#visits'), summary=$('#summary'), detail=$('#detail'); let current=[];
function add30(t){let [h,m]=t.split(':').map(Number);m+=30;h=(h+Math.floor(m/60))%24;m%=60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
async function start(role){try{await DPRO.demoLogin(role);DPRO.msg(S,`${role}としてDemo sessionを開始しました。`,'success');await load()}catch(e){DPRO.msg(S,e.message,'error')}}
async function load(){const j=await DPRO.api('/today');current=j.visits;summary.innerHTML=Object.entries(j.summary).map(([k,v])=>`<div class="card"><div class="muted">${DPRO.esc(k)}</div><div class="stat">${v}</div></div>`).join('');visits.innerHTML=j.visits.map(v=>`<article class="card visit ${v.claim_status==='blocked'?'warning':'ok'}"><div class="time">${DPRO.esc(v.start_time)}</div><div><strong>${DPRO.esc(v.patient.display_name)}</strong><div>${DPRO.esc(v.address?.label||'')}</div><div class="muted">${DPRO.esc(v.practitioner?.name||'未割当')}</div><span class="tag">${DPRO.esc(v.status)}</span><span class="tag">記録 ${DPRO.esc(v.record_status)}</span><span class="tag">連絡 ${DPRO.esc(v.contact_status)}</span><span class="tag">Claim ${DPRO.esc(v.claim_status)}</span></div><div class="right"><button class="secondary" onclick="notifyVisit('${v.id}')">安全通知</button></div></article>`).join('')||'<p>本日の訪問はありません。</p>'}
async function notifyVisit(id){try{const j=await DPRO.api('/communications',{method:'POST',body:JSON.stringify({visit_id:id,template:'visit_confirmed',channel:'line'})});detail.textContent=JSON.stringify(j,null,2);DPRO.msg(S,'健康情報を含まない承認済みtemplateで通知をqueueしました。','success')}catch(e){DPRO.msg(S,e.message,'error');detail.textContent=JSON.stringify(e.payload||{},null,2)}}
$('#loginOwner').onclick=()=>start('owner'); $('#loginOffice').onclick=()=>start('office_staff');
$('#reset').onclick=async()=>{try{if(DPRO.state.role!=='owner')await start('owner');const j=await DPRO.api('/demo/reset',{method:'POST',body:'{}'});detail.textContent=JSON.stringify(j,null,2);await load();DPRO.msg(S,'合成Demo dataを初期状態へ戻しました。','success')}catch(e){DPRO.msg(S,e.message,'error')}};
$('#preflight').onclick=async()=>{try{if(!current.length)throw new Error('先にOwner/Officeで開始してください。');const v=current[0];const j=await DPRO.api(`/visit-plans/${v.plan_id}/change-preflight`,{method:'POST',body:JSON.stringify({scope:'this_only',visit_id:v.id,visit_date:v.visit_date,start_time:add30(v.start_time),duration_min:v.duration_min,expected_plan_version:1})});detail.textContent=JSON.stringify(j,null,2);DPRO.msg(S,j.preflight.can_apply?'変更前のImpact確認が完了しました。':'Blocking impactを検出しました。',j.preflight.can_apply?'success':'notice')}catch(e){DPRO.msg(S,e.message,'error');detail.textContent=JSON.stringify(e.payload||{},null,2)}};
$('#claim').onclick=async()=>{try{let d=new Date(),month=d.toISOString().slice(0,7);const j=await DPRO.api('/claim-readiness/'+month);detail.textContent=JSON.stringify(j,null,2)}catch(e){DPRO.msg(S,e.message,'error')}};
if(DPRO.state.token&&['owner','office_staff'].includes(DPRO.state.role)) load().catch(()=>{});
</script></body></html>
