<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient / Family | DPRO 訪問マッサージ・鍼灸</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="bar"><div class="brand">DPRO 訪問マッサージ・鍼灸 / Patient・Family</div><nav class="nav"><a href="demo.html">DEMO</a><a href="owner.html">Owner</a></nav></div></header><main><h1>訪問予定</h1><p class="lead">患者本人と家族代理を別sessionとして扱い、家族は同意scopeを超えて施術メモを閲覧できません。</p><div class="actions"><button id="patient">患者本人で開始</button><button id="family" class="secondary">家族代理で開始</button></div><div id="status" class="notice">役割を選択してください。</div><div id="visits" class="grid"></div><section id="change" class="card hidden"><h2>変更希望</h2><label for="d">希望日</label><input id="d" type="date"><label for="t">希望時刻</label><input id="t" type="time" step="1800"><label for="reason">理由区分</label><select id="reason"><option value="schedule">予定都合</option><option value="family">家族都合</option><option value="health">体調</option><option value="other">その他</option></select><div class="actions"><button id="send">変更希望を送る</button></div></section><pre id="detail">未実行</pre></main><script src="config.js"></script><script src="app.js"></script><script>
const $=s=>document.querySelector(s),S=$('#status'),V=$('#visits'),change=$('#change'),detail=$('#detail');let current=null;
async function start(role){try{await DPRO.demoLogin(role);DPRO.msg(S,role==='family_proxy'?'家族代理scopeで開始しました。':'患者本人で開始しました。','success');await load()}catch(e){DPRO.msg(S,e.message,'error')}}
async function load(){const j=await DPRO.api('/today');current=j.visits[0]||null;V.innerHTML=j.visits.map(v=>`<article class="card"><strong>${DPRO.esc(v.visit_date)} ${DPRO.esc(v.start_time)}</strong><div>${DPRO.esc(v.patient.display_name)}</div><div>${DPRO.esc(v.address?.label||'')}</div><span class="tag">${DPRO.esc(v.status)}</span></article>`).join('')||'<p>表示可能な予定はありません。</p>';if(current){change.classList.remove('hidden');$('#d').value=current.visit_date;$('#t').value=current.start_time}}
$('#send').onclick=async()=>{try{const j=await DPRO.api('/change-requests',{method:'POST',body:JSON.stringify({visit_id:current.id,requested_date:$('#d').value,requested_time:$('#t').value,reason_category:$('#reason').value})});detail.textContent=JSON.stringify(j,null,2);DPRO.msg(S,'変更希望を受け付けました。確定変更ではなく運営側確認待ちです。','success')}catch(e){DPRO.msg(S,e.message,'error');detail.textContent=JSON.stringify(e.payload||{},null,2)}};
$('#patient').onclick=()=>start('customer');$('#family').onclick=()=>start('family_proxy'); if(DPRO.state.token&&['customer','family_proxy'].includes(DPRO.state.role))load().catch(()=>{});
</script></body></html>
