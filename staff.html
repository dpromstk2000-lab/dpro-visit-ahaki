<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff | DPRO 訪問マッサージ・鍼灸</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="bar"><div class="brand">DPRO 訪問マッサージ・鍼灸 / Staff</div><nav class="nav"><a href="demo.html">DEMO</a><a href="owner.html">Owner</a></nav></div></header><main><h1>本日の担当訪問</h1><p class="lead">割り当てられた患者だけを表示します。常時GPSは使わず、住所確認は訪問イベントの必要時だけです。</p><button id="login">Staffで開始</button><div id="status" class="notice">Staff Demo sessionを開始してください。</div><div id="visits" class="grid"></div><section id="record" class="card hidden"><h2>施術記録</h2><p id="recordPatient"></p><label for="summary">施術要約（Demo合成情報のみ）</label><textarea id="summary" rows="5">Demo施術記録：状態を確認し、無理のない範囲で施術を実施。</textarea><div class="actions"><button id="saveRecord">記録を完了</button></div></section><pre id="detail">未実行</pre></main><script src="config.js"></script><script src="app.js"></script><script>
const $=s=>document.querySelector(s), S=$('#status'), V=$('#visits'), detail=$('#detail'), rec=$('#record'); let selected=null;
async function start(){try{await DPRO.demoLogin('staff');DPRO.msg(S,'Staff sessionを開始しました。assigned visitだけを取得します。','success');await load()}catch(e){DPRO.msg(S,e.message,'error')}}
async function load(){const j=await DPRO.api('/today');V.innerHTML=j.visits.map(v=>`<article class="card visit"><div class="time">${DPRO.esc(v.start_time)}</div><div><strong>${DPRO.esc(v.patient.display_name)}</strong><div>${DPRO.esc(v.address?.label||'')}</div><p>${DPRO.esc(v.patient.care_notes||'')}</p><span class="tag">${DPRO.esc(v.status)}</span><span class="tag">記録 ${DPRO.esc(v.record_status)}</span></div><div class="right actions">${v.status==='confirmed'?`<button onclick="setStatus('${v.id}','arrived')">到着</button>`:''}${v.status==='arrived'?`<button onclick="openRecord('${v.id}','${DPRO.esc(v.patient.display_name)}')">記録</button>`:''}${v.status==='arrived'?`<button class="secondary" onclick="setStatus('${v.id}','completed')">完了</button>`:''}</div></article>`).join('')||'<p>担当訪問はありません。</p>'; window._visits=j.visits}
async function setStatus(id,status){try{const j=await DPRO.api(`/visits/${id}/status`,{method:'POST',body:JSON.stringify({status})});detail.textContent=JSON.stringify(j,null,2);await load()}catch(e){DPRO.msg(S,e.message,'error');detail.textContent=JSON.stringify(e.payload||{},null,2)}}
function openRecord(id,name){selected=id;$('#recordPatient').textContent=name;rec.classList.remove('hidden');$('#summary').focus()}
$('#saveRecord').onclick=async()=>{try{if(!selected)throw new Error('訪問を選択してください。');const j=await DPRO.api(`/visits/${selected}/treatment-record`,{method:'POST',body:JSON.stringify({summary:$('#summary').value})});detail.textContent=JSON.stringify(j,null,2);DPRO.msg(S,'施術記録を完了しました。原記録を保持するversioned運用です。','success');rec.classList.add('hidden');await load()}catch(e){DPRO.msg(S,e.message,'error');detail.textContent=JSON.stringify(e.payload||{},null,2)}};
$('#login').onclick=start; if(DPRO.state.role==='staff'&&DPRO.state.token)load().catch(()=>{});
</script></body></html>
