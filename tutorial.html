<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>はじめてガイド | DPRO 訪問マッサージ・鍼灸</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="bar"><div class="brand">はじめてガイド</div><nav class="nav"><a href="guide.html">ガイドセンター</a><a href="owner.html">運営画面</a></nav></div></header><main><h1>最初の5ステップ</h1><p class="lead">本番患者ではなく、まずDemoの合成データで操作の流れを確認します。</p><div id="progress" class="notice">0 / 5 完了</div><div class="grid" id="steps"></div><div class="actions"><button id="resume">次の未完了へ</button><button class="secondary" id="replay">最初からやり直す</button></div></main><script>
const steps=[['1','今日の訪問を見る','Owner画面で、未記録・未連絡・Claim blockerを確認します。','owner.html'],['2','施術者の担当を見る','Staff画面では自分に割り当てられた訪問だけが表示されます。','staff.html'],['3','変更Impactを確認','継続予定を変更する前に、担当衝突・施設人数区分・通知・請求準備への影響を確認します。','owner.html'],['4','患者・家族画面を見る','患者本人と家族代理で見える範囲が違うことを確認します。','customer.html'],['5','System Checkを確認','運用前に安全設定と環境状態を一括確認します。','system-check.html']];let done=JSON.parse(localStorage.getItem('dpro_ahaki_tutorial')||'[]');function render(){document.querySelector('#progress').textContent=`${done.length} / ${steps.length} 完了`;document.querySelector('#steps').innerHTML=steps.map(([n,t,d,u],i)=>`<section class="card ${done.includes(i)?'ok':''}"><div class="muted">STEP ${n}</div><h2>${t}</h2><p>${d}</p><div class="actions"><a href="${u}"><button class="secondary">画面を開く</button></a><button onclick="mark(${i})">${done.includes(i)?'完了済み':'完了にする'}</button></div></section>`).join('')}function mark(i){if(!done.includes(i))done.push(i);localStorage.setItem('dpro_ahaki_tutorial',JSON.stringify(done));render()}document.querySelector('#resume').onclick=()=>{const i=steps.findIndex((_,i)=>!done.includes(i));if(i<0)return;location.href=steps[i][3]};document.querySelector('#replay').onclick=()=>{done=[];localStorage.removeItem('dpro_ahaki_tutorial');render()};render();
</script></body></html>
