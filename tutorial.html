<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>First10 | DPRO 訪問マッサージ・鍼灸</title>
  <style>
    :root{
      --t-deep:#0a211a;--t-green:#118565;--t-mint:#18c98a;--t-soft:#f3f8f6;
      --t-line:#d9e6e1;--t-muted:#5f726b;--t-danger:#9d2f2f;--t-warn:#fff6e5;
      --t-header:64px;--t-card-w:min(390px,calc(100vw - 24px))
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,system-ui,sans-serif;background:#eef4f1;color:#10231d;overflow:hidden}
    button,a{font:inherit}
    .t-header{height:var(--t-header);display:flex;align-items:center;gap:12px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--t-line);position:relative;z-index:30}
    .t-brand{font-weight:950;white-space:nowrap}
    .t-meta{min-width:0;display:flex;align-items:center;gap:10px;flex:1}
    .t-progress-text{font-size:14px;font-weight:900;white-space:nowrap}
    .t-progress{height:8px;min-width:100px;max-width:320px;flex:1;background:#dfeae5;border-radius:999px;overflow:hidden}
    .t-progress>span{display:block;height:100%;width:10%;background:var(--t-mint);transition:width .2s ease}
    .t-header-actions{display:flex;gap:8px}
    .t-header a,.t-header button,.t-dock button,.t-dock a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;border:1px solid var(--t-line);background:#fff;color:#10231d;padding:0 12px;text-decoration:none;font-weight:900;cursor:pointer}
    .t-header button:focus-visible,.t-header a:focus-visible,.t-btn:focus-visible,.t-recovery a:focus-visible,.t-dock button:focus-visible,.t-dock a:focus-visible{outline:3px solid #0c6;outline-offset:3px}
    .t-stage{position:relative;height:calc(100% - var(--t-header));background:#dce7e2}
    #targetFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
    #targetMarker{position:fixed;z-index:40;display:none;pointer-events:none;border:4px solid #00ad72;border-radius:12px;box-shadow:0 0 0 5px rgba(0,173,114,.16),0 0 0 9999px rgba(2,18,12,.12);transition:top .15s,left .15s,width .15s,height .15s}
    .t-panel{position:fixed;z-index:50;width:var(--t-card-w);max-height:min(56vh,470px);overflow:auto;background:#fff;border:1px solid #bfd8cf;border-radius:20px;box-shadow:0 18px 60px rgba(0,35,24,.25);padding:0;left:16px;top:calc(var(--t-header) + 16px);touch-action:none}
    .t-panel[hidden],#targetMarker[hidden],.t-dock[hidden]{display:none!important}
    .t-drag{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#f7fbf9;border-bottom:1px solid var(--t-line);cursor:grab;user-select:none;touch-action:none}
    .t-drag:active{cursor:grabbing}
    .t-drag strong{font-size:12px;letter-spacing:.08em;color:var(--t-green)}
    .t-drag span{font-size:12px;color:var(--t-muted)}
    .t-content{padding:16px 18px 18px}
    .t-kicker{font-size:12px;font-weight:950;letter-spacing:.1em;color:var(--t-green)}
    .t-panel h1{font-size:clamp(22px,4vw,30px);line-height:1.25;margin:5px 0 9px}
    .t-role{display:inline-flex;min-height:30px;align-items:center;padding:0 10px;border-radius:999px;background:#edf7f3;color:#2d5a4a;font-weight:850;font-size:12px}
    .t-body{font-size:15px;line-height:1.75;color:#38544b;margin:12px 0}
    .t-safe{padding:11px 12px;border-left:4px solid var(--t-green);background:#eff9f5;color:#34584b;margin:12px 0;font-size:14px}
    .t-target{font-size:12px;color:var(--t-muted);padding:8px 10px;background:#f7f9f8;border-radius:9px;overflow-wrap:anywhere}
    .t-target b{color:var(--t-green)}
    .t-controls{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;margin-top:14px}
    .t-btn{min-height:48px;border:1px solid var(--t-line);border-radius:12px;background:#fff;color:#10231d;font-weight:900;cursor:pointer}
    .t-btn.primary{background:var(--t-mint);border-color:var(--t-mint);color:#052018}
    .t-btn:disabled{opacity:.42;cursor:not-allowed}
    .t-missing{border-color:#e2b8b8}
    .t-missing .t-drag{background:#fff7f7}
    .t-missing .t-kicker{color:var(--t-danger)}
    .t-recovery{padding:12px;border-radius:12px;background:var(--t-warn);margin:12px 0;color:#5e481e}
    .t-recovery-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .t-recovery a,.t-recovery button{min-height:48px;display:flex;align-items:center;justify-content:center;border:1px solid #d8c79e;border-radius:11px;background:#fff;color:#2e281c;text-decoration:none;font-weight:900;cursor:pointer}
    .t-complete{text-align:center;padding:22px 18px}
    .t-complete h1{margin:6px 0 10px}
    .t-complete-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
    .t-complete-actions a{min-height:48px;display:inline-flex;align-items:center;padding:0 16px;border-radius:12px;text-decoration:none;font-weight:900;border:1px solid var(--t-line);background:#fff;color:#10231d}
    .t-complete-actions a.primary{background:var(--t-mint);border-color:var(--t-mint)}
    .t-dock{position:fixed;z-index:55;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:1px solid var(--t-line);border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 12px 36px rgba(0,35,24,.18);backdrop-filter:blur(8px)}
    .t-loading{position:fixed;z-index:45;left:50%;top:calc(var(--t-header) + 14px);transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(10,33,26,.88);color:#fff;font-size:12px;font-weight:900;pointer-events:none}
    .t-loading[hidden]{display:none}
    @media(max-width:700px){
      :root{--t-header:58px}
      .t-header{padding:7px 9px}
      .t-brand{font-size:13px}
      .t-meta{gap:6px}
      .t-progress-text{font-size:12px}
      .t-progress{min-width:54px}
      .t-header-actions a{display:none}
      .t-header-actions button{min-height:42px;padding:0 10px;font-size:12px}
      .t-panel{max-height:min(52vh,420px)}
      .t-content{padding:14px}
      .t-panel h1{font-size:22px}
      .t-body{font-size:14px}
      .t-controls{grid-template-columns:1fr 1fr}
      .t-controls #close{grid-column:1/-1}
      .t-recovery-actions{grid-template-columns:1fr}
      .t-dock{width:calc(100% - 16px);justify-content:stretch}
      .t-dock>*{flex:1}
    }
    @media(max-width:390px){
      .t-brand{max-width:112px;overflow:hidden;text-overflow:ellipsis}
      .t-progress-text{font-size:11px}
      .t-panel{max-height:50vh}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body data-tutorial-contract="1.2.2">
  <header class="t-header">
    <div class="t-brand">DPRO First10</div>
    <div class="t-meta">
      <div id="progressText" class="t-progress-text">Step 1 / 10</div>
      <div class="t-progress" aria-hidden="true"><span id="progressBar"></span></div>
    </div>
    <div class="t-header-actions">
      <a href="guide.html">Guide Center</a>
      <button id="closeTop" type="button">閉じる</button>
    </div>
  </header>

  <main class="t-stage" aria-label="First10 実画面ナビゲーション">
    <iframe id="targetFrame" title="First10 対象画面" src="about:blank"></iframe>
  </main>

  <div id="targetMarker" aria-hidden="true"></div>
  <div id="loading" class="t-loading" role="status">対象画面を確認しています…</div>

  <section id="tutorialPanel" class="t-panel" role="dialog" aria-modal="false" aria-labelledby="tutorialTitle">
    <div id="dragHandle" class="t-drag">
      <strong>TUTORIAL NAVIGATION V1.2.2</strong>
      <span>ドラッグで移動</span>
    </div>
    <div id="panelBody" class="t-content"></div>
  </section>

  <div id="closedDock" class="t-dock" hidden>
    <button id="reopen" type="button">First10を再表示</button>
    <a id="returnGuide" href="guide.html">Guide Centerへ戻る</a>
  </div>

  <script>
    (() => {
      'use strict';

      const VERSION = '1.2.2';
      const KEY = 'dpro_visit_ahaki_first10_v11';
      const WAIT_MS = 4200;
      const POLL_MS = 80;
      const HIGHLIGHT_ATTR = 'data-dpro-tutorial-highlight';
      const HIGHLIGHT_STYLE_ID = 'dpro-tutorial-highlight-style-v122';

      const STEPS = [
        {
          step_id:'visit-ahaki-first10-01-demo-safety', order:1, role_or_surface:'public_demo',
          target_page_or_route:'demo.html', target_selector:'.notice', title:'公開Demoの安全ルール',
          body:'最初に、公開Demoが合成データを使う確認環境であることを確認します。実在する患者・家族の情報は入力しません。',
          safe:'このStepではDemo Resetや業務保存を実行しません。', placement:'auto', target_required:true
        },
        {
          step_id:'visit-ahaki-first10-02-owner-entry', order:2, role_or_surface:'owner_entry',
          target_page_or_route:'owner.html', target_selector:'#loginOwner', title:'Owner / Officeの入口',
          body:'Owner / Office画面の入口を確認します。役割の開始操作は、画面を開いたあと利用者自身が行います。',
          safe:'First10からOwner / Officeへ自動ログインしません。', placement:'auto', target_required:true
        },
        {
          step_id:'visit-ahaki-first10-03-today-visits', order:3, role_or_surface:'owner_presentation',
          target_page_or_route:'owner.html', target_selector:'main > h1', title:'今日の訪問を確認',
          body:'「今日の訪問」がOwner / Officeの日次確認の入口であることを確認します。',
          safe:'First10は訪問の状態を変更しません。', placement:'auto', target_required:true
        },
        {
          step_id:'visit-ahaki-first10-04-impact-preflight', order:4, role_or_surface:'owner_presentation',
          target_page_or_route:'owner.html', target_selector:'#preflight', title:'変更前の影響を確認',
          body:'継続予定を変更する前に、担当衝突や関連項目への影響を確認する入口を見ます。',
          safe:'Impact確認ボタンをFirst10が自動で押すことはありません。', placement:'auto', target_required:true
        },
        {
          step_id:'visit-ahaki-first10-05-claim-readiness', order:5, role_or_surface:'owner_presentation',
          target_page_or_route:'owner.html', target_selector:'#claim', title:'請求準備の入口を確認',
          body:'今月の請求準備状況を確認する入口を把握します。',
          safe:'First10から請求処理やAPIを自動実行しません。', placement:'auto', target_required:true
        },
        {
          step_id:'visit-ahaki-first10-06-staff-assigned-visits', order:6, role_or_surface:'staff_entry',
          target_page_or_route:'staff.html', target_selector:'#login', title:'Staffの担当訪問を確認',
          body:'Staff画面の役割入口を確認し、自分に割り当てられた訪問を見る流れを理解します。',
          safe:'First10からStaffへ自動ログインせず、到着・記録・完了も自動実行しません。', placement:'auto', target_required:true
        },
        {
          step_id:'visit-ahaki-first10-07-patient-schedule', order:7, role_or_surface:'patient_entry',
          target_page_or_route:'customer.html', target_selector:'#patient', title:'患者本人の予定を確認',
          body:'患者本人の訪問予定へ入るための役割入口を確認します。',
          safe:'First10から患者本人へ自動ログインせず、変更希望も送信しません。', placement:'auto', target_required:true
        },
        {
          step_id:'visit-ahaki-first10-08-family-scope', order:8, role_or_surface:'family_entry',
          target_page_or_route:'customer.html', target_selector:'#family', title:'家族代理の表示範囲を確認',
          body:'家族代理の入口を確認し、患者本人とは別の同意範囲で表示する考え方を確認します。',
          safe:'First10から家族代理へ自動ログインせず、変更希望も送信しません。', placement:'auto', target_required:true
        },
        {
          step_id:'visit-ahaki-first10-09-safe-family-contact', order:9, role_or_surface:'guide_safety',
          target_page_or_route:'guide.html', target_selector:'[data-group="owner"] .guide-list li:nth-child(4)', title:'安全な家族連絡を確認',
          body:'Guide Centerの安定した安全説明を使い、健康情報を含めない家族連絡の考え方を確認します。',
          safe:'First10からLINEやその他の連絡送信を自動実行しません。', placement:'auto', target_required:true
        },
        {
          step_id:'visit-ahaki-first10-10-system-check', order:10, role_or_surface:'system_check',
          target_page_or_route:'system-check.html', target_selector:'#run', title:'System Checkを確認',
          body:'運用前の安全設定と環境状態を確認する一括チェックの入口を確認します。',
          safe:'First10は一括チェックを自動クリックしません。対象画面自身の既存GET確認はそのままです。', placement:'auto', target_required:true
        }
      ];

      const frame = document.querySelector('#targetFrame');
      const marker = document.querySelector('#targetMarker');
      const panel = document.querySelector('#tutorialPanel');
      const panelBody = document.querySelector('#panelBody');
      const dragHandle = document.querySelector('#dragHandle');
      const progressText = document.querySelector('#progressText');
      const progressBar = document.querySelector('#progressBar');
      const closeTop = document.querySelector('#closeTop');
      const loading = document.querySelector('#loading');
      const closedDock = document.querySelector('#closedDock');
      const reopen = document.querySelector('#reopen');

      let state;
      let activeTarget = null;
      let activeStep = null;
      let pendingIndex = null;
      let missingIndex = null;
      let closed = false;
      let manuallyDragged = false;
      let overlapRatio = 0;
      let activationSerial = 0;

      function fresh(){
        return {
          current:0,
          step_id:STEPS[0].step_id,
          completed:false,
          updatedAt:new Date().toISOString()
        };
      }

      function normalizeState(value){
        if(!value || typeof value !== 'object') return null;
        let index = Number.isInteger(value.current) ? value.current : -1;
        if(value.step_id){
          const byId = STEPS.findIndex(step => step.step_id === value.step_id);
          if(byId >= 0) index = byId;
        }
        if(index < 0 || index >= STEPS.length) return null;
        return {
          current:index,
          step_id:STEPS[index].step_id,
          completed:Boolean(value.completed),
          updatedAt:value.updatedAt || new Date().toISOString()
        };
      }

      function read(){
        try{return normalizeState(JSON.parse(localStorage.getItem(KEY) || 'null'))}catch{return null}
      }

      function save(){
        state.updatedAt = new Date().toISOString();
        localStorage.setItem(KEY, JSON.stringify(state));
      }

      function routeName(){
        try{
          const url = new URL(frame.contentWindow.location.href);
          return url.pathname.split('/').filter(Boolean).pop() || '';
        }catch{
          try{
            const url = new URL(frame.src, location.href);
            return url.pathname.split('/').filter(Boolean).pop() || '';
          }catch{return ''}
        }
      }

      function setProgress(index, completed=false){
        if(completed){
          progressText.textContent = '10 / 10 完了';
          progressBar.style.width = '100%';
          return;
        }
        progressText.textContent = `Step ${index + 1} / ${STEPS.length}`;
        progressBar.style.width = `${((index + 1) / STEPS.length) * 100}%`;
      }

      function clearHighlight(){
        if(activeTarget){
          try{activeTarget.removeAttribute(HIGHLIGHT_ATTR)}catch{}
        }
        activeTarget = null;
        marker.hidden = true;
        marker.style.display = 'none';
      }

      function ensureHighlightStyle(doc){
        if(doc.getElementById(HIGHLIGHT_STYLE_ID)) return;
        const style = doc.createElement('style');
        style.id = HIGHLIGHT_STYLE_ID;
        style.textContent = `
          [${HIGHLIGHT_ATTR}="true"]{
            outline:4px solid #00ad72!important;
            outline-offset:4px!important;
            border-radius:8px!important;
            box-shadow:0 0 0 7px rgba(0,173,114,.16)!important;
            position:relative!important;
            z-index:2147483000!important;
          }`;
        doc.head.appendChild(style);
      }

      function targetVisible(target){
        try{
          const win = frame.contentWindow;
          const style = win.getComputedStyle(target);
          const rect = target.getBoundingClientRect();
          return style.display !== 'none' &&
            style.visibility !== 'hidden' &&
            Number(style.opacity || 1) !== 0 &&
            rect.width > 0 && rect.height > 0 &&
            rect.bottom > 0 && rect.right > 0 &&
            rect.top < win.innerHeight && rect.left < win.innerWidth;
        }catch{return false}
      }

      function waitForTarget(selector, serial){
        const started = performance.now();
        return new Promise(resolve => {
          const tick = () => {
            if(serial !== activationSerial) return resolve(null);
            let target = null;
            try{target = frame.contentDocument && frame.contentDocument.querySelector(selector)}catch{}
            if(target) return resolve(target);
            if(performance.now() - started >= WAIT_MS) return resolve(null);
            setTimeout(tick, POLL_MS);
          };
          tick();
        });
      }

      function waitFrameLoad(route, forceReload, serial){
        const current = routeName();
        if(!forceReload && current === route){
          try{
            if(frame.contentDocument && frame.contentDocument.readyState === 'complete') return Promise.resolve(true);
          }catch{}
        }
        return new Promise(resolve => {
          const timer = setTimeout(() => {
            frame.removeEventListener('load', onload);
            resolve(false);
          }, WAIT_MS + 1800);
          const onload = () => {
            clearTimeout(timer);
            if(serial !== activationSerial) return resolve(false);
            resolve(true);
          };
          if(forceReload && current === route){
            frame.removeEventListener('load', onload);
            const blankDone = () => {
              if(serial !== activationSerial) return;
              frame.addEventListener('load', onload, {once:true});
              frame.src = route;
            };
            frame.addEventListener('load', blankDone, {once:true});
            frame.src = 'about:blank';
          }else{
            frame.addEventListener('load', onload, {once:true});
            frame.src = route;
          }
        });
      }

      function parentRectForTarget(target){
        const fr = frame.getBoundingClientRect();
        const tr = target.getBoundingClientRect();
        return {
          left:fr.left + tr.left,
          top:fr.top + tr.top,
          right:fr.left + tr.right,
          bottom:fr.top + tr.bottom,
          width:tr.width,
          height:tr.height
        };
      }

      function intersectionRatio(a,b){
        const left = Math.max(a.left,b.left);
        const top = Math.max(a.top,b.top);
        const right = Math.min(a.right,b.right);
        const bottom = Math.min(a.bottom,b.bottom);
        const area = Math.max(0,right-left) * Math.max(0,bottom-top);
        const targetArea = Math.max(1,a.width*a.height);
        return area/targetArea;
      }

      function clamp(v,min,max){return Math.min(Math.max(v,min),Math.max(min,max))}

      function placePanel(target){
        if(closed || panel.hidden || manuallyDragged || !target) return;
        const t = parentRectForTarget(target);
        const pw = Math.min(panel.offsetWidth || 390, window.innerWidth - 16);
        const ph = Math.min(panel.offsetHeight || 320, window.innerHeight - 16);
        const gap = 14;
        const minTop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--t-header')) + 8;
        const maxTop = window.innerHeight - ph - 8;
        const maxLeft = window.innerWidth - pw - 8;
        const candidates = [
          {left:t.right+gap, top:t.top+(t.height-ph)/2},
          {left:t.left-pw-gap, top:t.top+(t.height-ph)/2},
          {left:t.left+(t.width-pw)/2, top:t.bottom+gap},
          {left:t.left+(t.width-pw)/2, top:t.top-ph-gap},
          {left:8, top:window.innerHeight-ph-8},
          {left:window.innerWidth-pw-8, top:minTop}
        ].map(c => ({
          left:clamp(c.left,8,maxLeft),
          top:clamp(c.top,minTop,maxTop)
        }));
        let best = null;
        for(const c of candidates){
          const r = {left:c.left,top:c.top,right:c.left+pw,bottom:c.top+ph,width:pw,height:ph};
          const ratio = intersectionRatio(t,r);
          const movement = Math.abs(c.left-t.left)+Math.abs(c.top-t.top);
          if(!best || ratio < best.ratio || (ratio === best.ratio && movement < best.movement)){
            best = {...c,ratio,movement};
          }
        }
        panel.style.left = `${best.left}px`;
        panel.style.top = `${best.top}px`;
        overlapRatio = best.ratio;
        updateMarker(target);
      }

      function updateMarker(target){
        if(!target || closed) return;
        const r = parentRectForTarget(target);
        const pad = 6;
        marker.hidden = false;
        marker.style.display = 'block';
        marker.style.left = `${Math.max(0,r.left-pad)}px`;
        marker.style.top = `${Math.max(0,r.top-pad)}px`;
        marker.style.width = `${Math.min(window.innerWidth, r.width+pad*2)}px`;
        marker.style.height = `${Math.min(window.innerHeight, r.height+pad*2)}px`;
      }

      function renderStep(step,index){
        panel.classList.remove('t-missing');
        panelBody.innerHTML = `
          <div class="t-kicker">STEP ${String(index+1).padStart(2,'0')} / 10</div>
          <h1 id="tutorialTitle">${step.title}</h1>
          <span class="t-role">${step.role_or_surface}</span>
          <p class="t-body">${step.body}</p>
          <div class="t-safe">${step.safe}</div>
          <div class="t-target"><b>対象</b> ${step.target_page_or_route} → ${escapeHtml(step.target_selector)}</div>
          <div class="t-controls" aria-label="First10操作">
            <button id="back" class="t-btn" type="button" ${index===0?'disabled':''}>Back</button>
            <button id="next" class="t-btn primary" type="button">${index===STEPS.length-1?'完了':'Next'}</button>
            <button id="close" class="t-btn" type="button">Close</button>
          </div>`;
        panel.querySelector('#back').onclick = () => activate(index-1);
        panel.querySelector('#next').onclick = () => {
          if(index === STEPS.length-1) complete();
          else activate(index+1);
        };
        panel.querySelector('#close').onclick = closeTutorial;
        requestAnimationFrame(() => panel.querySelector('#next')?.focus({preventScroll:true}));
      }

      function renderMissing(step,index){
        panel.classList.add('t-missing');
        panelBody.innerHTML = `
          <div class="t-kicker">TARGET_MISSING / STEP ${String(index+1).padStart(2,'0')}</div>
          <h1 id="tutorialTitle">画面が見つかりません</h1>
          <p class="t-body">「${step.title}」の対象を時間内に確認できませんでした。自動で次へ進まず、このStepで停止しています。</p>
          <div class="t-recovery">
            <div><b>対象:</b> ${step.target_page_or_route} → ${escapeHtml(step.target_selector)}</div>
            <div class="t-recovery-actions">
              <button id="retry" type="button">Retry</button>
              <a href="guide.html">Guide Centerへ戻る</a>
            </div>
          </div>`;
        panel.querySelector('#retry').onclick = () => activate(index,{forceReload:true});
        requestAnimationFrame(() => panel.querySelector('#retry')?.focus({preventScroll:true}));
      }

      function renderComplete(){
        clearHighlight();
        setProgress(STEPS.length-1,true);
        panel.classList.remove('t-missing');
        panelBody.innerHTML = `
          <div class="t-complete">
            <div class="t-kicker">COMPLETE</div>
            <h1 id="tutorialTitle">First10が完了しました。</h1>
            <p class="t-body">10個すべての対象画面を確認しました。First10自身はログイン・保存・送信・承認・Demo Reset・業務状態変更を自動実行していません。</p>
            <div class="t-complete-actions">
              <a class="primary" href="guide.html">Guide Centerへ戻る</a>
              <a href="tutorial.html?mode=replay">最初から再体験</a>
            </div>
          </div>`;
      }

      function escapeHtml(value){
        return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      }

      async function resolveTarget(step,index,serial,forceReload){
        loading.hidden = false;
        clearHighlight();
        manuallyDragged = false;
        const loaded = await waitFrameLoad(step.target_page_or_route, forceReload, serial);
        if(serial !== activationSerial) return false;
        if(!loaded){
          loading.hidden = true;
          return false;
        }
        const target = await waitForTarget(step.target_selector, serial);
        if(serial !== activationSerial) return false;
        if(!target){
          loading.hidden = true;
          return false;
        }

        try{
          ensureHighlightStyle(frame.contentDocument);
          target.scrollIntoView({block:'center',inline:'nearest',behavior:'auto'});
          await new Promise(r => setTimeout(r,120));
          target.setAttribute(HIGHLIGHT_ATTR,'true');
          activeTarget = target;
          activeStep = step;
          updateMarker(target);
        }catch{
          loading.hidden = true;
          return false;
        }

        if(!targetVisible(target)){
          try{
            target.scrollIntoView({block:'center',inline:'nearest',behavior:'auto'});
            await new Promise(r => setTimeout(r,100));
          }catch{}
        }

        loading.hidden = true;
        state.current = index;
        state.step_id = step.step_id;
        state.completed = false;
        save();
        setProgress(index,false);
        renderStep(step,index);
        requestAnimationFrame(() => placePanel(target));
        return true;
      }

      async function activate(index,options={}){
        if(index < 0 || index >= STEPS.length) return false;
        const serial = ++activationSerial;
        const step = STEPS[index];
        pendingIndex = index;
        missingIndex = null;
        closed = false;
        panel.hidden = false;
        closedDock.hidden = true;
        setProgress(index,false);

        const ok = await resolveTarget(step,index,serial,Boolean(options.forceReload));
        if(serial !== activationSerial) return false;
        pendingIndex = null;
        if(!ok){
          missingIndex = index;
          clearHighlight();
          renderMissing(step,index);
          loading.hidden = true;
          manuallyDragged = false;
          placePanel(null);
          return false;
        }
        missingIndex = null;
        return true;
      }

      function complete(){
        if(!activeStep || state.current !== STEPS.length-1) return;
        state.completed = true;
        save();
        renderComplete();
      }

      function closeTutorial(){
        closed = true;
        panel.hidden = true;
        clearHighlight();
        closedDock.hidden = false;
        loading.hidden = true;
        save();
        reopen.focus({preventScroll:true});
      }

      function reopenTutorial(){
        closed = false;
        closedDock.hidden = true;
        panel.hidden = false;
        if(state.completed){
          renderComplete();
        }else if(missingIndex !== null){
          renderMissing(STEPS[missingIndex],missingIndex);
        }else{
          renderStep(STEPS[state.current],state.current);
          if(activeTarget){
            try{activeTarget.setAttribute(HIGHLIGHT_ATTR,'true')}catch{}
            updateMarker(activeTarget);
            requestAnimationFrame(()=>placePanel(activeTarget));
          }else{
            activate(state.current);
          }
        }
      }

      function status(){
        const target = activeTarget;
        let targetFound = Boolean(target);
        let targetVisibleNow = false;
        let highlightVisible = false;
        let targetRect = null;
        if(target){
          try{
            targetVisibleNow = targetVisible(target);
            highlightVisible = target.getAttribute(HIGHLIGHT_ATTR) === 'true';
            targetRect = parentRectForTarget(target);
          }catch{}
        }
        return {
          version:VERSION,
          current:state?.current ?? null,
          step_id:state?.step_id ?? null,
          completed:Boolean(state?.completed),
          route:missingIndex!==null ? STEPS[missingIndex].target_page_or_route : (activeStep?.target_page_or_route || null),
          actual_route:routeName(),
          selector:missingIndex!==null ? STEPS[missingIndex].target_selector : (activeStep?.target_selector || null),
          target_found:targetFound,
          target_visible_after_scroll:targetVisibleNow,
          highlight_visible:highlightVisible && marker.style.display !== 'none',
          overlay_visible:!panel.hidden,
          overlay_target_overlap_ratio:Number(overlapRatio.toFixed(4)),
          target_rect:targetRect,
          closed,
          target_missing:missingIndex !== null,
          pending_index:pendingIndex,
          draggable:true
        };
      }

      function getTargetMap(){
        return STEPS.map(step => ({...step}));
      }

      // Expose read-only runtime evidence hooks for automated QA.
      window.DPROFirst10 = Object.freeze({
        version:VERSION,
        getTargetMap,
        status,
        retry:() => missingIndex === null ? Promise.resolve(false) : activate(missingIndex,{forceReload:true})
      });

      // Dragging is available when the automatic placement cannot avoid a target.
      (() => {
        let dragging = false, startX=0, startY=0, startLeft=0, startTop=0;
        const onMove = e => {
          if(!dragging) return;
          const p = e.touches ? e.touches[0] : e;
          const pw = panel.offsetWidth, ph = panel.offsetHeight;
          const minTop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--t-header')) + 4;
          panel.style.left = `${clamp(startLeft + p.clientX-startX,4,window.innerWidth-pw-4)}px`;
          panel.style.top = `${clamp(startTop + p.clientY-startY,minTop,window.innerHeight-ph-4)}px`;
          manuallyDragged = true;
          if(activeTarget){
            const t = parentRectForTarget(activeTarget);
            const r = panel.getBoundingClientRect();
            overlapRatio = intersectionRatio(t,r);
          }
          e.preventDefault();
        };
        const stop = () => {
          dragging = false;
          window.removeEventListener('pointermove',onMove);
          window.removeEventListener('pointerup',stop);
          window.removeEventListener('touchmove',onMove);
          window.removeEventListener('touchend',stop);
        };
        const start = e => {
          if(e.target.closest('button,a')) return;
          const p = e.touches ? e.touches[0] : e;
          dragging = true;
          startX = p.clientX; startY = p.clientY;
          const r = panel.getBoundingClientRect();
          startLeft = r.left; startTop = r.top;
          if(e.type === 'touchstart'){
            window.addEventListener('touchmove',onMove,{passive:false});
            window.addEventListener('touchend',stop,{once:true});
          }else{
            window.addEventListener('pointermove',onMove);
            window.addEventListener('pointerup',stop,{once:true});
          }
        };
        dragHandle.addEventListener('pointerdown',start);
        dragHandle.addEventListener('touchstart',start,{passive:true});
      })();

      closeTop.onclick = closeTutorial;
      reopen.onclick = reopenTutorial;

      document.addEventListener('keydown', e => {
        if(e.key === 'Escape' && !closed){
          e.preventDefault();
          closeTutorial();
        }
      });

      window.addEventListener('resize',() => {
        if(activeTarget && !closed && !manuallyDragged) requestAnimationFrame(()=>placePanel(activeTarget));
      });

      frame.addEventListener('load',() => {
        if(activeTarget && !closed){
          setTimeout(() => {
            try{updateMarker(activeTarget);placePanel(activeTarget)}catch{}
          },100);
        }
      });

      const mode = new URLSearchParams(location.search).get('mode');
      if(mode === 'start' || mode === 'replay'){
        state = fresh();
        save();
      }else{
        state = read() || fresh();
        save();
      }

      if(state.completed && mode !== 'replay' && mode !== 'start'){
        renderComplete();
        loading.hidden = true;
      }else{
        activate(state.current);
      }
    })();
  </script>
</body>
</html>
