<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Check | DPRO 訪問マッサージ・鍼灸</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="bar"><div class="brand">DPRO 訪問マッサージ・鍼灸 / System Check</div><nav class="nav"><a href="demo.html">DEMO</a></nav></div></header><main><h1>System Check</h1><p class="lead">患者名・病歴・施術記録・secretを表示せず、運用に必要なbindingとGuardだけを確認します。</p><button id="run">一括チェック</button><div id="result" class="notice">未実行</div><div id="checks" class="grid"></div><pre id="raw">未実行</pre></main><script src="config.js"></script><script src="app.js"></script><script>
const $=s=>document.querySelector(s);async function run(){try{const j=await DPRO.api('/system-check');DPRO.msg($('#result'),j.ok?'BLOCKING CHECK PASS':'BLOCKING CHECK FAIL',j.ok?'success':'error');$('#checks').innerHTML=j.checks.map(c=>`<div class="card ${c.pass?'ok':'danger'}"><strong>${DPRO.esc(c.id)}</strong><div>${c.pass?'PASS':'FAIL'} ${c.blocking?' / BLOCKING':''}</div><div class="muted">${DPRO.esc(c.detail)}</div></div>`).join('');$('#raw').textContent=JSON.stringify(j,null,2)}catch(e){DPRO.msg($('#result'),e.message,'error')}}$('#run').onclick=run;run();
</script></body></html>
